                                            { key: 'name', label: '姓名' },
                                            ...(activeTab === 'data' ? [{ key: 'gender', label: '性别' }, { key: 'adminClass', label: '行政班级' }, { key: 'optionClass', label: '选项' }, { key: 'teacherName', label: '教师' }] : []),
                                            ...(activeTab === 'run' ? [{ key: 'runCount', label: '乐跑次数', render: s => s.scores.runCount }, { key: 'runScore', label: '乐跑成绩', render: s => s.scores.runScore + (s.scores.isRunFailed ? '(不合格)' : '') }] : []),
                                            ...(activeTab === 'theory' ? [{ key: 'theory', label: '理论成绩', render: s => s.scores.theory === '' ? '-' : s.scores.theory }] : [])
                                        ]}
                                    />
                                    
                                    <div className="pt-2 flex justify-between items-center text-xs mt-auto">
                                        <span>共 {filteredStudents.length} 条</span>
                                        <div className="flex gap-1">
                                            <button onClick={()=>setCurrentPageState(p=>Math.max(1, p-1))} disabled={currentPageState===1} className="border px-2 rounded">上一页</button>
                                            <span>{currentPageState}/{totalPages}</span>
                                            <button onClick={()=>setCurrentPageState(p=>Math.min(totalPages, p+1))} disabled={currentPageState===totalPages} className="border px-2 rounded">下一页</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    {editModal && <AdminEditModal student={editModal.student} mode={editModal.mode} onClose={()=>setEditModal(null)} onSave={handleSaveEdit}/>}
                </div>
            );
        };

        const TeacherPanel = ({ currentUser, students, setStudents, semester, setSemester, onLogout, sportsList, specialtyConfig }) => {
            const [selectedClass, setSelectedClass] = useState('');
            const [viewMode, setViewMode] = useState('card'); 
            const [editingStudent, setEditingStudent] = useState(null);
            const [showClaimModal, setShowClaimModal] = useState(false);
            const [toastMsg, setToastMsg] = useState('');
            const [batchField, setBatchField] = useState('regular1');
            const [docView, setDocView] = useState(null);
            const semesterOptions = getSemesterOptions();
            const semType = getSemesterType(semester);

            const myStudents = useMemo(() => students.filter(s => {
                if (s.semester !== semester) return false;
                const teachers = (s.teacherName || '').split(/\s+/);
                return teachers.includes(currentUser.name);
            }), [students, currentUser.name, semester]);
            
            const myClasses = useMemo(() => [...new Set(myStudents.map(s => s.optionClass))].sort(), [myStudents]);
            const classStudents = useMemo(() => {
                if(!selectedClass) return [];
                return myStudents.filter(s => s.optionClass === selectedClass).sort((a,b)=>parseInt(a.id)-parseInt(b.id));
            }, [myStudents, selectedClass]);
            
            const matchedSport = useMemo(() => {
                if (!selectedClass) return sportsList[0];
                return sportsList.find(s => selectedClass.includes(s)) || sportsList[0];
            }, [selectedClass, sportsList]);
            const config = specialtyConfig[matchedSport] || { spec1: {type:'score'}, spec2: {type:'score'} };

            const allClassesForClaim = useMemo(() => {
                const map = {};
                const currentSemStudents = students.filter(s => s.semester === semester);
                currentSemStudents.forEach(s => {
                    const clsName = s.optionClass;
                    if (!map[clsName]) map[clsName] = { name: clsName, teacher: s.teacherName, count: 0 };
                    map[clsName].count++;
                    if(s.teacherName && !map[clsName].teacher) map[clsName].teacher = s.teacherName;
                });
                return Object.values(map).sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
            }, [students, semester]);

            const handleClaimClass = (className) => {
                const teacherName = currentUser.name;
                setStudents(prev => prev.map(s => {
                    if (s.semester === semester && s.optionClass === className) {
                        let names = (s.teacherName || '').split(/\s+/).filter(n => n);
                        if (!names.includes(teacherName)) {
                            names.push(teacherName); 
                        } else {
                            names = names.filter(n => n !== teacherName); 
                        }
                        return { ...s, teacherName: names.join(' ') };
                    }
                    return s;
                }));
                setToastMsg(`操作成功: "${className}"`);
            };

            const handleBatchUpdate = (updates) => {
                setStudents(prev => {
                    const newStudents = [...prev];
                    updates.forEach(u => {
                        const idx = newStudents.findIndex(s => s.id === u.id && s.semester === semester);
                        if(idx >= 0) newStudents[idx] = { ...newStudents[idx], ...u };
                    });
                    return newStudents;
                });
            };

            const handleSaveOne = (sid, scores) => {
                setStudents(prev => prev.map(s => (s.id === sid && s.semester === semester) ? { ...s, scores } : s));
            };

            const handleBatchSaveScore = useCallback((studentId, updates) => {
                setStudents(prev => prev.map(s => {
                    if (s.id === studentId && s.semester === semester) {
                        return { ...s, scores: { ...s.scores, ...updates } };
                    }
                    return s;
                }));
            }, [semester]); 

            const handleExport = () => {
                if (!selectedClass) return;
                const exportData = classStudents.map((s, index) => {
                    const finalScore = calculateFinalScore(s.scores, semType);
                    const row = {
                        '序号': index + 1, '行政班级': s.adminClass, '学号': s.id, '姓名': s.name, '性别': s.gender,
                        '平时1': s.scores.regular1, '平时2': s.scores.regular2,
                        '专项': ((parseFloat(s.scores.special1||0) + parseFloat(s.scores.special2||0))/2).toFixed(1),
                        '统考': (((calculateStdTestScore(s.scores.rawItem1, getTestItemsName(semType, s.gender).item1, s.gender) || 0) + (calculateStdTestScore(s.scores.rawItem2, getTestItemsName(semType, s.gender).item2, s.gender) || 0)) / 2).toFixed(1),
                        '晨跑(次数)': s.scores.runCount, '晨跑(成绩)': s.scores.runScore,
                    };
                    if (semType === 'spring') row['理论'] = s.scores.theory;
                    row['总评'] = finalScore;
                    return row;
                });
                const ws = XLSX.utils.json_to_sheet(exportData);
                const range = XLSX.utils.decode_range(ws['!ref']);
                const colMap = {};
                for(let C = range.s.c; C <= range.e.c; ++C) {
                    const cell = ws[XLSX.utils.encode_cell({r:0, c:C})];
                    if(cell) colMap[cell.v] = C;
                }
                const colName = colMap['姓名'];
                const colTotal = colMap['总评'];
                const colRun = colMap['晨跑(成绩)'];

                for (let R = range.s.r + 1; R <= range.e.r; ++R) {
                    const s = classStudents[R-1]; 
                    if (!s) continue;
                    const final = calculateFinalScore(s.scores, semType);
                    const isTotalFail = parseFloat(final) < 60;
                    const isRunFail = s.scores.isRunFailed;

                    const colorCell = (c, r) => {
                        const cellRef = XLSX.utils.encode_cell({c, r});
                        if (!ws[cellRef]) ws[cellRef] = { t:'s', v: '' }; 
                        ws[cellRef].s = { font: { color: { rgb: "FF0000" }, bold: true } };
                    };

                    if (isTotalFail) {
                        if (colName !== undefined) colorCell(colName, R);
                        if (colTotal !== undefined) colorCell(colTotal, R);
                    }
                    if (isRunFail && colRun !== undefined) { colorCell(colRun, R); }
                }

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "成绩表");
                XLSX.writeFile(wb, `${semester}-成绩表-${selectedClass}-${currentUser.name}.xlsx`);
            };

            const batchOptions = [
                { key: 'regular1', label: '平时分1' }, { key: 'regular2', label: '平时分2' },
                { key: 'special1', label: '专项分1' }, { key: 'special2', label: '专项分2' },
                { key: 'runCount', label: '乐跑次数' }, { key: 'runScore', label: '乐跑得分' },
                { key: 'stdItem1', label: '统考项目1' }, { key: 'stdItem2', label: '统考项目2' },
            ];
            if (semType === 'spring') batchOptions.push({ key: 'theory', label: '理论成绩' });

            if (docView) {
                return (
                    <div className="min-h-screen bg-gray-50 pb-20 flex flex-col">
                         <header className="bg-white shadow z-10 p-3 flex justify-between items-center">
                            <h1 className="font-bold">文档管理</h1>
                             <button onClick={() => setDocView(null)} className="text-sm text-gray-500">关闭</button>
                        </header>
                         <div className="flex-1 overflow-hidden p-4">
                             <DocumentManager category={docView} teacherName={currentUser.name} onBack={() => setDocView(null)} />
                         </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20 flex flex-col">
                    <header className="bg-white shadow z-10">
                        <div className="p-3 flex justify-between items-center">
                            <h1 className="font-bold">{currentUser.name}老师</h1>
                            <div className="flex items-center gap-2">
                                <select value={semester} onChange={(e) => setSemester(e.target.value)} className="text-xs text-gray-500 border rounded p-1 bg-gray-50">{semesterOptions.map(opt => (<option key={opt} value={opt}>{opt}</option>))}</select>
                                <button onClick={onLogout} className="text-sm text-gray-500">退出</button>
                            </div>
                        </div>
                        <div className="px-3 pb-2 flex gap-2 overflow-x-auto hide-scrollbar border-b border-gray-100">
                             <button onClick={() => setDocView('syllabus')} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-indigo-50 text-indigo-600 text-xs font-bold whitespace-nowrap">教学大纲</button>
                             <button onClick={() => setDocView('schedule')} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-purple-50 text-purple-600 text-xs font-bold whitespace-nowrap">教学进度表</button>
                             <button onClick={() => setDocView('plan')} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-teal-50 text-teal-600 text-xs font-bold whitespace-nowrap">教案</button>
                        </div>
                        <div className="px-3 py-2 bg-gray-50 flex items-center scrolling-wrapper gap-2">
                            <button onClick={() => setShowClaimModal(true)} className="flex-shrink-0 mr-3 px-3 py-1.5 rounded-full text-sm border border-dashed border-blue-400 text-blue-600 bg-blue-50 flex items-center gap-1 hover:bg-blue-100 whitespace-nowrap">认领班级</button>
                            {myClasses.map(c => (<button key={c} onClick={()=>{setSelectedClass(c); setViewMode('card');}} className={`flex-shrink-0 mr-2 px-3 py-1 rounded text-sm ${selectedClass===c?'bg-blue-600 text-white':'bg-white border'}`}>{c}</button>))}
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden relative">
                        {!selectedClass ? (
                            <div className="p-10 text-center text-gray-400">请选择班级 (或点击上方"认领班级"添加)</div>
                        ) : (
                            <>
                                <div className="p-2 bg-white border-b flex gap-2 overflow-x-auto">
                                    <button onClick={()=>setViewMode('card')} className={`px-3 py-1 text-xs rounded border ${viewMode==='card'?'bg-blue-50 border-blue-500 text-blue-700':''}`}>成绩录入</button>
                                    <button onClick={()=>setViewMode('std')} className={`px-3 py-1 text-xs rounded border ${viewMode==='std'?'bg-blue-50 border-blue-500 text-blue-700':''}`}>统考记录</button>
                                    <button onClick={()=>setViewMode('attendance')} className={`px-3 py-1 text-xs rounded border ${viewMode==='attendance'?'bg-blue-50 border-blue-500 text-blue-700':''}`}>考勤管理</button>
                                </div>

                                <div className="h-full overflow-y-auto p-2 pb-24">
                                    {viewMode === 'card' && (
                                        <>
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                                                <span className="text-sm text-gray-500">班级人数: {classStudents.length}</span>
                                                <div className="flex gap-2">
                                                    <div className="flex bg-white rounded-lg shadow-sm border p-1">
                                                        <button onClick={() => setViewMode('card')} className={`px-3 py-1 text-xs rounded bg-blue-100 text-blue-700 font-bold`}>卡片模式</button>
                                                        <button onClick={() => setViewMode('batch')} className={`px-3 py-1 text-xs rounded text-gray-500`}>按项目录入</button>
                                                    </div>
                                                    <button onClick={handleExport} className="flex items-center gap-1 bg-green-600 text-white px-3 py-1.5 rounded text-sm hover:bg-green-700"><Icon name="download" size={14}/> 导出</button>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                {classStudents.map(s => {
                                                    const final = calculateFinalScore(s.scores, semType);
                                                    const isFail = parseFloat(final) < 60;
                                                    return (
                                                        <div key={s.id} onClick={()=>setEditingStudent(s)} className="bg-white p-4 rounded shadow-sm border border-gray-100 active:scale-95 transition-transform">
                                                            <div className="flex justify-between items-start">
                                                                <div><h3 className="font-bold">{s.name}</h3><p className="text-xs text-gray-500">{s.id}</p></div>
                                                                <div className="text-right">
                                                                    <div className={`font-bold text-lg ${isFail ? 'text-red-600' : 'text-blue-600'}`}>{final}</div>
                                                                    {s.scores.isRunFailed && <span className="text-xs text-red-500 block">乐跑不合格</span>}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </>
                                    )}

                                    {viewMode === 'batch' && (
                                        <>
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                                                <span className="text-sm text-gray-500">班级人数: {classStudents.length}</span>
                                                <div className="flex gap-2">
                                                    <div className="flex bg-white rounded-lg shadow-sm border p-1">
                                                        <button onClick={() => setViewMode('card')} className={`px-3 py-1 text-xs rounded text-gray-500`}>卡片模式</button>
                                                        <button onClick={() => setViewMode('batch')} className={`px-3 py-1 text-xs rounded bg-blue-100 text-blue-700 font-bold`}>按项目录入</button>
                                                    </div>
                                                    <select value={batchField} onChange={(e) => setBatchField(e.target.value)} className="border border-blue-300 rounded px-2 py-1 text-sm focus:ring-2 ring-blue-500 outline-none">
                                                        {batchOptions.map(opt => <option key={opt.key} value={opt.key}>{opt.label}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <BatchEntryTable students={classStudents} field={batchField} fieldName={batchOptions.find(o => o.key === batchField)?.label} semester={semester} config={config} onBatchSave={handleBatchSaveScore} />
                                        </>
                                    )}

                                    {viewMode === 'std' && (
                                        <div className="h-full">
                                            <StdTestModule students={classStudents} semester={semester} className={selectedClass} teacherName={currentUser.name} onSave={handleBatchUpdate} onClose={()=>setViewMode('card')} />
                                        </div>
                                    )}

                                    {viewMode === 'attendance' && (
                                        <div className="h-full">
                                            <AttendanceModule students={classStudents} semester={semester} className={selectedClass} teacherName={currentUser.name} onSave={handleBatchUpdate} onClose={()=>setViewMode('card')} />
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </main>

                    {/* 认领弹窗 */}
                    {showClaimModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-xl w-full max-w-lg shadow-2xl flex flex-col max-h-[80vh] relative z-[101]">
                                <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                                    <h3 className="text-lg font-bold">认领/添加班级</h3>
                                    <button onClick={() => setShowClaimModal(false)} className="text-2xl">&times;</button>
                                </div>
                                <div className="p-4 overflow-y-auto">
                                    <p className="text-sm text-gray-500 mb-4">点击“添加”将班级加入您的列表。再次点击可取消。</p>
                                    <div className="space-y-2">
                                        {allClassesForClaim.map(cls => {
                                            // Check using string splitting
                                            const teacherNames = (cls.teacher || '').split(/\s+/);
                                            const isClaimed = teacherNames.includes(currentUser.name);
                                            return (
                                                <div key={cls.name} className="flex justify-between items-center p-3 border rounded hover:bg-gray-50">
                                                    <div>
                                                        <div className="font-bold text-gray-800">{cls.name}</div>
                                                        <div className="text-xs text-gray-500">
                                                            学生: {cls.count} | 
                                                            原分配: {cls.teacher ? <span className="text-green-600">{cls.teacher}</span> : <span className="text-red-500">未分配</span>}
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={() => handleClaimClass(cls.name)}
                                                        className={`text-xs px-3 py-1.5 rounded text-white ${isClaimed ? 'bg-gray-400 hover:bg-gray-500' : 'bg-blue-600 hover:bg-blue-700'}`}
                                                    >
                                                        {isClaimed ? '取消认领' : '添加'}
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editingStudent && (
                        <GradingModal 
                            student={editingStudent} 
                            semester={semester} 
                            onClose={()=>setEditingStudent(null)} 
                            onSave={handleSaveOne}
                            sportsList={sportsList}
                            specialtyConfig={specialtyConfig}
                        />
                    )}
                    
                    {toastMsg && <Toast msg={toastMsg} onClose={() => setToastMsg('')} />}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [students, setStudents] = useState([]);
            const [teachers, setTeachers] = useState(INITIAL_TEACHERS);
            const [sportsList, setSportsList] = useState(DEFAULT_SPORTS_LIST);
            const [specialtyConfig, setConfig] = useState(DEFAULT_SPECIALTY_CONFIG);
            const [semester, setSemester] = useState(getDefaultSemester());
            const [adminPassword, setAdminPassword] = useState('admin888');
            const [saveStatus, setSaveStatus] = useState(''); // '', 'saving', 'saved', 'error'
            const dataReadyRef = React.useRef(false); // 数据初始化完成标志

            // --- 初始化：从 Supabase 加载所有数据 ---
            useEffect(() => {
                (async () => {
                    setLoading(true);
                    try {
                        const [dbTeachers, dbStudents, dbSportsList, dbSpecConfig, dbAdminPwd] = await Promise.all([
                            DB.getTeachers(),
                            DB.getStudents(),
                            DB.getConfig('sports_list', DEFAULT_SPORTS_LIST),
                            DB.getConfig('specialty_config', DEFAULT_SPECIALTY_CONFIG),
                            DB.getConfig('admin_password', 'admin888'),
                        ]);
                        if (dbTeachers && dbTeachers.length > 0) setTeachers(dbTeachers);
                        if (dbStudents) setStudents(dbStudents);
                        if (dbSportsList) setSportsList(dbSportsList);
                        if (dbSpecConfig) setConfig(dbSpecConfig);
                        if (dbAdminPwd) setAdminPassword(dbAdminPwd);
                        // 等待一个短暂延迟，让所有 setState 完成渲染后再标记就绪
                        setTimeout(() => { dataReadyRef.current = true; }, 500);
                    } catch (err) {
                        console.error('初始化加载失败:', err);
                        try {
                            const ls = JSON.parse(localStorage.getItem('pe_students'));
                            if (ls && ls.length > 0) {
                                setStudents(ls);
                                alert('⚠️ 云端连接失败，已加载本地缓存数据。请检查 Supabase 配置。');
                            }
                        } catch(e) {}
                        setTimeout(() => { dataReadyRef.current = true; }, 500);
                    }
                    setLoading(false);
                })();
            }, []);

            // --- 学生数据变化时自动同步到 Supabase ---
            const saveTimerRef = React.useRef(null);
            useEffect(() => {
                // 数据未就绪前，不触发任何保存
                if (!dataReadyRef.current) return;
                if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                setSaveStatus('saving');
                saveTimerRef.current = setTimeout(async () => {
                    try {
                        await DB.saveStudents(students);
                        setSaveStatus('saved');
                        setTimeout(() => setSaveStatus(''), 2000);
                    } catch (err) {
                        console.error('保存失败:', err);
                        setSaveStatus('error');
                    }
                }, 1500);
                return () => clearTimeout(saveTimerRef.current);
            }, [students]);

            // --- 教师数据同步 ---
            useEffect(() => {
                if (!dataReadyRef.current) return;
                DB.setTeachers(teachers);
            }, [teachers]);

            // --- 配置数据同步 ---
            useEffect(() => {
                if (!dataReadyRef.current) return;
                DB.setConfig('sports_list', sportsList);
            }, [sportsList]);

            useEffect(() => {
                if (!dataReadyRef.current) return;
                DB.setConfig('specialty_config', specialtyConfig);
            }, [specialtyConfig]);

            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, []);

            if (loading) return (
                <div className="loading-overlay">
                    <div className="spinner"></div>
                    <p className="mt-4 text-gray-500 text-sm">正在连接云端数据...</p>
                </div>
            );

            if (!user) return <LoginPage onLogin={setUser} users={teachers} adminPassword={adminPassword} />;

            const SaveIndicator = () => {
                if (!saveStatus) return null;
                const styles = { saving: 'bg-yellow-100 text-yellow-700', saved: 'bg-green-100 text-green-700', error: 'bg-red-100 text-red-700' };
                const labels = { saving: '☁️ 正在同步...', saved: '✅ 已同步到云端', error: '❌ 同步失败，请检查网络' };
                return <div className={`fixed bottom-4 right-4 px-3 py-1.5 rounded-full text-xs z-[200] shadow ${styles[saveStatus]}`}>{labels[saveStatus]}</div>;
            };

            return (
                <>
                    <SaveIndicator />
                    {user.role === 'admin' 
                        ? <AdminPanel 
                            students={students} setStudents={setStudents} 
                            semester={semester} setSemester={setSemester} 
                            onLogout={() => setUser(null)}
                            sportsList={sportsList} setSportsList={setSportsList}
                            config={specialtyConfig} setConfig={setConfig}
                            teachers={teachers} setTeachers={setTeachers}
                          />
                        : <TeacherPanel 
                            currentUser={user} 
                            students={students} setStudents={setStudents}
                            semester={semester} setSemester={setSemester}
                            onLogout={() => setUser(null)}
                            sportsList={sportsList}
                            specialtyConfig={specialtyConfig}
                          />
                    }
                </>
            );
        };

        // --- ErrorBoundary: 防止白屏，显示具体错误 ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
            render() {
                if (this.state.hasError) {
                    return React.createElement('div', { style: { padding: '40px', textAlign: 'center' } },
                        React.createElement('h2', { style: { color: '#ef4444', marginBottom: '16px' } }, '⚠️ 页面出现错误'),
                        React.createElement('pre', { style: { background: '#f3f4f6', padding: '16px', borderRadius: '8px', textAlign: 'left', overflow: 'auto', fontSize: '12px', maxHeight: '300px' } }, String(this.state.error)),
                        React.createElement('button', { onClick: () => { this.setState({ hasError: false, error: null }); }, style: { marginTop: '16px', padding: '8px 24px', background: '#3b82f6', color: 'white', borderRadius: '8px', border: 'none', cursor: 'pointer' } }, '重试'),
                        React.createElement('p', { style: { marginTop: '12px', color: '#6b7280', fontSize: '13px' } }, '请截图此页面并发送给开发者')
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
