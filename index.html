        <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // =============================================================
        // ★★★ Supabase 配置 - 请替换为你自己的项目信息 ★★★
        // =============================================================
        const SUPABASE_URL = 'https://iuqlialbqubcodxoofal.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HD6i11vRDnUCAIl1hYaZ1w_8DdEbkLW';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =============================================================
        // Supabase 数据库操作层
        // =============================================================
        const DB = {
            // --- 教师 ---
            async getTeachers() {
                const { data, error } = await supabase.from('teachers').select('*').order('id');
                if (error) { console.error('getTeachers:', error); return null; }
                return data.map(t => ({ name: t.name, id: t.id }));
            },
            async setTeachers(teachers) {
                await supabase.from('teachers').delete().neq('id', '');
                const rows = teachers.map(t => ({ id: t.id, name: t.name }));
                await supabase.from('teachers').upsert(rows);
            },
            // --- 配置 ---
            async getConfig(key, defaultVal) {
                const { data, error } = await supabase.from('app_config').select('value').eq('key', key).single();
                if (error || !data) return defaultVal;
                return data.value;
            },
            async setConfig(key, value) {
                await supabase.from('app_config').upsert({ key, value, updated_at: new Date().toISOString() });
            },
            // --- 签名 ---
            async getSignature(teacherName) {
                const { data } = await supabase.from('app_config').select('value').eq('key', `sig_${teacherName}`).single();
                return data?.value || null;
            },
            async setSignature(teacherName, base64) {
                await supabase.from('app_config').upsert({ key: `sig_${teacherName}`, value: base64, updated_at: new Date().toISOString() });
            },
            // --- 换考认领 ---
            async getSwapClaims() {
                const { data } = await supabase.from('app_config').select('value').eq('key', 'swap_claims').single();
                return data?.value || {};
            },
            async setSwapClaims(claims) {
                await supabase.from('app_config').upsert({ key: 'swap_claims', value: claims, updated_at: new Date().toISOString() });
            },
            // --- 学生 ---
            async getStudents() {
                // Supabase 默认最多返回 1000 行，需要分页获取全部
                let allData = [];
                let from = 0;
                const pageSize = 1000;
                while (true) {
                    const { data, error } = await supabase.from('students').select('*').range(from, from + pageSize - 1);
                    if (error) { console.error('getStudents:', error); return null; }
                    if (!data || data.length === 0) break;
                    allData = allData.concat(data);
                    if (data.length < pageSize) break; // 最后一页
                    from += pageSize;
                }
                return allData.map(row => ({
                    id: row.id, semester: row.semester, name: row.name, gender: row.gender,
                    adminClass: row.admin_class, optionClass: row.option_class, teacherName: row.teacher_name,
                    scores: row.scores || { regular1:'', regular2:'', special1:'', special2:'', runCount:'', runScore:'', stdItem1:'', stdItem2:'', theory:'', mock1:'', mock2:'', hw1:'', hw2:'' },
                    attendance: row.attendance || [], stdTestRecords: row.std_test_records || {},
                }));
            },
            async saveStudents(students) {
                if (!students || students.length === 0) {
                    console.log('saveStudents: 空数据，跳过保存（防止误删）');
                    return;
                }
                const rows = students.map(s => ({
                    id: s.id, semester: s.semester, name: s.name, gender: s.gender,
                    admin_class: s.adminClass, option_class: s.optionClass, teacher_name: s.teacherName,
                    scores: s.scores, attendance: s.attendance || [], std_test_records: s.stdTestRecords || {},
                    updated_at: new Date().toISOString()
                }));
                
                // 仅使用 upsert（不删除任何数据，只新增或更新）
                for (let i = 0; i < rows.length; i += 500) {
                    const chunk = rows.slice(i, i + 500);
                    const { error } = await supabase.from('students').upsert(chunk, { onConflict: 'id,semester' });
                    if (error) {
                        console.error('upsert失败:', error.message);
                        throw new Error('保存失败: ' + error.message);
                    }
                }
            },
            async deleteStudent(id, semester) {
                await supabase.from('students').delete().eq('id', id).eq('semester', semester);
            },
            async deleteStudentsBySemester(semester) {
                await supabase.from('students').delete().eq('semester', semester);
            },
            // --- 文档 ---
            async getDocs(teacherName, category) {
                const { data, error } = await supabase.from('documents').select('*').eq('teacher_name', teacherName).eq('category', category).order('created_at', { ascending: false });
                if (error) return [];
                return data.map(d => {
                    const isInline = d.storage_path && d.storage_path.startsWith('data:');
                    return {
                        id: d.id, name: d.file_name, date: new Date(d.created_at).toLocaleDateString(),
                        size: d.file_size, type: d.file_type, storagePath: d.storage_path,
                        url: isInline ? d.storage_path : `${SUPABASE_URL}/storage/v1/object/public/documents/${d.storage_path}`,
                        isInline
                    };
                });
            },
            async uploadDoc(teacherName, category, file) {
                const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
                const safeName = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
                const path = `${category}/${safeName}`;
                const mimeMap = { pdf:'application/pdf', doc:'application/msword', docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', ppt:'application/vnd.ms-powerpoint', pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation', xls:'application/vnd.ms-excel', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', gif:'image/gif' };
                const contentType = mimeMap[ext] || file.type || 'application/octet-stream';
                const meta = { teacher_name: teacherName, category, file_name: file.name, file_size: (file.size / 1024).toFixed(1) + ' KB', file_type: contentType };

                // 策略1：SDK 上传到 Storage
                try {
                    const { data, error } = await supabase.storage.from('documents').upload(path, file, { contentType, cacheControl: '3600', upsert: false });
                    if (!error && data) {
                        await supabase.from('documents').insert({ ...meta, storage_path: path });
                        return;
                    }
                    console.warn('Storage SDK:', error?.message || JSON.stringify(error));
                } catch(e) { console.warn('Storage SDK异常:', e.message); }

                // 策略2：XHR 直传 Storage
                try {
                    await new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', `${SUPABASE_URL}/storage/v1/object/documents/${path}`);
                        xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
                        xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
                        xhr.setRequestHeader('Content-Type', contentType);
                        xhr.onload = () => xhr.status >= 200 && xhr.status < 300 ? resolve() : reject(new Error(xhr.status + ':' + xhr.responseText));
                        xhr.onerror = () => reject(new Error('网络错误'));
                        xhr.send(file);
                    });
                    await supabase.from('documents').insert({ ...meta, storage_path: path });
                    return;
                } catch(e) { console.warn('Storage XHR:', e.message); }

                // 策略3（终极兜底）：文件转 base64 存入数据库，完全绕过 Storage
                console.warn('Storage 不可用，启用数据库直存兜底');
                if (file.size > 8 * 1024 * 1024) throw new Error('Storage 服务不可用，且文件超过 8MB 无法使用数据库兜底存储。请联系管理员检查 Supabase Storage 配置。');
                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error('文件读取失败'));
                    reader.readAsDataURL(file);
                });
                const { error: dbErr } = await supabase.from('documents').insert({ ...meta, storage_path: base64 });
                if (dbErr) throw new Error('数据库存储失败: ' + dbErr.message);
            },
            async deleteDoc(id, storagePath) {
                if (storagePath && !storagePath.startsWith('data:')) {
                    try { await supabase.storage.from('documents').remove([storagePath]); } catch(e) { console.warn('Storage delete:', e); }
                }
                await supabase.from('documents').delete().eq('id', id);
            },
            // 下载文件（兼容 Storage 和内嵌 base64）
            async downloadFile(storagePath) {
                // 内嵌 base64 → 直接转 Blob
                if (storagePath && storagePath.startsWith('data:')) {
                    try {
                        const res = await fetch(storagePath);
                        return await res.blob();
                    } catch(e) {
                        const [header, b64] = storagePath.split(',');
                        const mime = header.match(/data:([^;]+)/)?.[1] || 'application/octet-stream';
                        const bin = atob(b64);
                        const bytes = new Uint8Array(bin.length);
                        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                        return new Blob([bytes], { type: mime });
                    }
                }
                // Storage 文件 → 多策略下载
                const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/documents/${storagePath}`;
                // 策略1：Supabase SDK download
                try {
                    const { data, error } = await supabase.storage.from('documents').download(storagePath);
                    if (!error && data && data.size > 0) return data;
                } catch(e) { console.warn('SDK download failed:', e); }
                // 策略2：fetch + apikey header
                try {
                    const res = await fetch(publicUrl, { headers: { 'apikey': SUPABASE_ANON_KEY } });
                    if (res.ok) return await res.blob();
                } catch(e) { console.warn('Fetch with key failed:', e); }
                // 策略3：纯 fetch（公开桶）
                try {
                    const res = await fetch(publicUrl);
                    if (res.ok) return await res.blob();
                } catch(e) { console.warn('Plain fetch failed:', e); }
                throw new Error('文件下载失败，请检查网络');
            }
        };

        // --- 1. 基础配置 ---
        const INITIAL_TEACHERS = [{ name: "张老师", id: "T001" }, { name: "王老师", id: "T002" }]; // fallback only
        const DEFAULT_SPORTS_LIST = ["田径", "篮球", "排球", "足球", "乒乓球", "羽毛球", "网球", "垒球", "橄榄球", "武术", "健身健美", "健美操", "瑜伽", "排舞", "啦啦操", "形体", "体育舞蹈", "花样跳绳", "飞盘", "飞镖", "匹克球", "彩带龙"];
        const DEFAULT_SPECIALTY_CONFIG = {};
        // 通用文件下载/打开辅助函数（兼容 base64 内嵌和 Storage URL）
        const getDocDownloadUrl = (doc) => doc.isInline ? doc.url : (doc.url + '?download=');
        const triggerDownload = (doc) => {
            if (doc.isInline) {
                // base64 data URL → 创建临时 <a> 下载
                const a = document.createElement('a');
                a.href = doc.url;
                a.download = doc.name || 'file';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                triggerDownload(doc);
            }
        };

        const ATTENDANCE_STATUS = {
            'normal': { label: '正常', symbol: '', color: 'text-green-600' },
            'absent': { label: '无故旷课', symbol: '○', color: 'text-red-600' },
            'late': { label: '迟到', symbol: 'Φ', color: 'text-yellow-600' },
            'personal': { label: '事假', symbol: 'S', color: 'text-blue-600' },
            'sick': { label: '病假', symbol: 'B', color: 'text-purple-600' },
            'uniform': { label: '服装不符', symbol: '△', color: 'text-pink-600' },
            'other': { label: '其他', symbol: '备注', color: 'text-gray-600' }
        };
        const SCORING_STANDARDS = {
            '1200m跑': { type: 'time', gender: '女', table: [[5.14, 100], [5.40, 90], [6.07, 80], [6.33, 70], [7.00, 60], [7.15, 50], [7.30, 40], [8.30, 0]] },
            '1500m跑': { type: 'time', gender: '男', table: [[5.14, 100], [5.40, 90], [6.07, 80], [6.33, 70], [7.00, 60], [7.18, 50], [7.35, 40], [8.46, 0]] },
            '立定跳远_男': { type: 'distance', gender: '男', table: [[2.73, 100], [2.57, 90], [2.41, 80], [2.26, 70], [2.10, 60], [2.05, 50], [2.00, 40], [1.80, 0]] },
            '立定跳远_女': { type: 'distance', gender: '女', table: [[2.07, 100], [1.95, 90], [1.83, 80], [1.72, 70], [1.60, 60], [1.54, 50], [1.49, 40], [1.25, 0]] },
            '100m跑_男': { type: 'time', gender: '男', table: [[13.40, 100], [14.00, 90], [14.60, 80], [15.20, 70], [15.80, 60], [16.40, 50], [17.00, 40], [19.40, 0]] },
            '100m跑_女': { type: 'time', gender: '女', table: [[16.40, 100], [17.00, 90], [17.60, 80], [18.20, 70], [18.80, 60], [19.40, 50], [20.00, 40], [22.40, 0]] },
            '俯卧撑': { type: 'count', gender: '男', table: [[40, 100], [35, 90], [30, 80], [25, 70], [20, 60], [15, 50], [10, 40], [0, 0]] },
            '仰卧起坐': { type: 'count', gender: '女', table: [[56, 100], [49, 90], [42, 80], [35, 70], [28, 60], [26, 50], [24, 40], [14, 0]] }
        };

        // --- 2. 辅助函数 ---
        const parseInputToValue = (input, isLongRun) => {
            if (!input && input !== 0) return null;
            const str = String(input).trim();
            if (str === '') return null;
            if (isLongRun) {
                const parts = str.split('.');
                const min = parseInt(parts[0] || 0);
                const sec = parseInt(parts[1] || 0);
                return min * 60 + sec;
            }
            return parseFloat(str);
        };
        const calculateScoreGeneric = (val, type, tableOrConfig) => {
            if (val === null || val === undefined || isNaN(val)) return 0;
            let table = [];
            if (!Array.isArray(tableOrConfig)) {
                const c = tableOrConfig;
                table = [[c.p100, 100], [c.p60, 60], [c.p0, 0]];
            } else { table = tableOrConfig; }
            const isLowBetter = type === 'time';
            const bestVal = table[0][0];
            const worstVal = table[table.length - 1][0];
            if (isLowBetter) {
                if (val <= bestVal) return 100;
                if (val >= worstVal) return 0;
            } else {
                if (val >= bestVal) return 100;
                if (val <= worstVal) return 0;
            }
            for (let i = 0; i < table.length - 1; i++) {
                const [currVal, currScore] = table[i];
                const [nextVal, nextScore] = table[i+1];
                let inRange = false;
                if (isLowBetter) { if (val >= currVal && val <= nextVal) inRange = true; } 
                else { if (val <= currVal && val >= nextVal) inRange = true; }
                if (inRange) {
                    const ratio = (val - currVal) / (nextVal - currVal);
                    const score = currScore + ratio * (nextScore - currScore);
                    return Math.round(score * 10) / 10; 
                }
            }
            return 0;
        };
        const calculateStdTestScore = (inputVal, itemName, gender) => {
            let key = itemName;
            if (['立定跳远', '100m跑'].includes(itemName)) key = `${itemName}_${gender}`;
            const standard = SCORING_STANDARDS[key];
            if (!standard) return null;
            const isLongRun = ['1200m跑', '1500m跑'].includes(itemName);
            const val = parseInputToValue(inputVal, isLongRun);
            const processedTable = standard.table.map(([t, s]) => {
                return [isLongRun ? parseInputToValue(t, true) : t, s];
            });
            return calculateScoreGeneric(val, standard.type, processedTable);
        };
        const getBestRecord = (records, type) => {
            const validRecords = records.filter(r => r !== "" && r !== null && r !== undefined);
            if (validRecords.length === 0) return "";
            if (type === 'time') return validRecords.sort((a, b) => parseFloat(a) - parseFloat(b))[0];
            return validRecords.sort((a, b) => parseFloat(b) - parseFloat(a))[0];
        };
        const getTestItemsName = (semesterType, gender) => {
            if (semesterType === 'fall') {
                return { item1: gender === '男' ? '1500m跑' : '1200m跑', item2: '立定跳远', type1: 'time', type2: 'distance', display1: '男:1500m; 女:1200m', display2: '立定跳远' };
            } else {
                return { item1: gender === '男' ? '俯卧撑' : '仰卧起坐', item2: '100m跑', type1: 'count', type2: 'time', display1: '男:俯卧撑; 女:仰卧起坐', display2: '100m跑' };
            }
        };
        const calculateSpecialtyScore = (val, gender, config) => {
            if (!config) return val; 
            if (config.type === 'score') return parseFloat(val) || 0;
            const isMale = gender === '男';
            const thresholds = { p0: parseFloat(isMale ? config.m_0 : config.f_0), p60: parseFloat(isMale ? config.m_60 : config.f_60), p100: parseFloat(isMale ? config.m_100 : config.f_100) };
            const parsedVal = parseFloat(val);
            return calculateScoreGeneric(parsedVal, config.type, thresholds);
        };
        const calculateFinalScore = (scores, semesterType) => {
            const { regular1 = 0, regular2 = 0, special1 = 0, special2 = 0, runScore = 0, stdItem1 = 0, stdItem2 = 0, theory, isRunFailed = false } = scores;
            const theoryScore = theory === '' || theory === null ? 0 : parseFloat(theory);
            
            const specialAvg = (parseFloat(special1||0) + parseFloat(special2||0)) / 2;
            const stdTotal = (parseFloat(stdItem1||0) + parseFloat(stdItem2||0)) / 2;
            let total = 0;
            if (semesterType === 'fall') total = (regular1 * 0.1) + (regular2 * 0.1) + (stdTotal * 0.3) + (runScore * 0.1) + (specialAvg * 0.4);
            else total = (regular1 * 0.05) + (regular2 * 0.05) + (theoryScore * 0.1) + (stdTotal * 0.3) + (runScore * 0.1) + (specialAvg * 0.4);
            if (isRunFailed && total >= 60) return "59.0";
            return total.toFixed(1);
        };
        const getAttendanceSummary = (attendance) => {
            if (!attendance || attendance.length === 0) return "无考勤记录";
            const summary = {};
            let abnormalCount = 0;
            attendance.forEach(rec => {
                if (rec.status !== 'normal') {
                    summary[rec.status] = (summary[rec.status] || 0) + 1;
                    abnormalCount++;
                }
            });
            if (abnormalCount === 0) return "全勤，无异常";
            return Object.entries(summary).map(([status, count]) => `${ATTENDANCE_STATUS[status]?.label}${count}次`).join('，');
        };
        const getDefaultSemester = () => {
            const now = new Date();
            const month = now.getMonth();

        // --- Document Manager (Supabase Storage) ---

                    <div className="mb-4 bg-blue-50 p-4 rounded-lg border border-blue-100"><label className="block text-sm font-bold text-blue-800 mb-2">上传新文档</label><input type="file" onChange={handleUpload} disabled={uploading} className="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700"/>{uploading && <p className="text-xs text-blue-600 mt-2 animate-pulse">正在上传到云端...</p>}<p className="text-xs text-blue-400 mt-2">* 文件将上传至云端存储（最大 8MB）</p></div>

        // --- PDF 预览：PDF.js + 多策略下载 ---
        const PdfCanvasPreview = ({ sp, url }) => {
            const containerRef = React.useRef(null);
            const [status, setStatus] = useState('loading');
            const [errMsg, setErrMsg] = useState('');
            useEffect(() => {
                if (!window.pdfjsLib) { setErrMsg('PDF 预览库未加载'); setStatus('error'); return; }
                let cancelled = false;
                (async () => {
                    try {
                        const blob = await DB.downloadFile(sp);
                        if (cancelled) return;
                        const buf = await blob.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
                        if (cancelled) return;
                        const container = containerRef.current;
                        if (!container) return;
                        container.innerHTML = '';
                        const containerWidth = container.clientWidth || 360;
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const scale = (containerWidth - 16) / page.getViewport({ scale: 1 }).width;
                            const viewport = page.getViewport({ scale: Math.max(scale, 1) });
                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            canvas.style.width = '100%';
                            canvas.style.height = 'auto';
                            canvas.style.marginBottom = '8px';
                            canvas.style.boxShadow = '0 1px 3px rgba(0,0,0,0.12)';
                            container.appendChild(canvas);
                            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                        }
                        setStatus('done');
                    } catch (e) {
                        console.error('PDF render:', e);
                        if (!cancelled) { setErrMsg(e.message || '未知错误'); setStatus('error'); }
                    }
                })();
                return () => { cancelled = true; };
            }, [sp]);
            return (
                <div className="p-2 w-full">
                    {status === 'loading' && <div className="text-center py-10 text-gray-400 animate-pulse">正在加载 PDF...</div>}
                    {status === 'error' && <div className="text-center py-10 px-4"><p className="text-gray-500 mb-2">⚠️ PDF 预览失败{errMsg ? ': ' + errMsg : ''}</p><a href={url.startsWith('data:') ? url : url + '?download='} className="text-blue-600 underline text-sm">点击下载文件</a></div>}
                    <div ref={containerRef} />
                </div>
            );
        };

            const loadDocs = async () => { setLoading(true); setDocs(await DB.getDocs('__admin__', 'textbook')); setLoading(false); };
            useEffect(() => { loadDocs(); }, []);
            const handleUpload = async (e) => {
                const file = e.target.files[0]; if (!file) return;
                if (file.size > 8 * 1024 * 1024) { alert("文件过大！最大 8MB。"); return; }
                setUploading(true);
                try { await DB.uploadDoc('__admin__', 'textbook', file); await loadDocs(); alert("上传成功！"); }
                catch (err) { console.error('教材上传错误:', err); alert("上传失败：" + err.message); }
                setUploading(false); e.target.value = '';
            };
            const handleDelete = async (doc) => { if (!confirm("确定删除教材 \"" + doc.name + "\" ？")) return; await DB.deleteDoc(doc.id, doc.storagePath); setDocs(docs.filter(d => d.id !== doc.id)); };
            const getFileType = (name) => {
                const ext = (name || '').split('.').pop().toLowerCase();
                if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) return 'image';

                if (ext === 'pdf') return 'pdf';
                if (['doc','docx'].includes(ext)) return 'docx';
                if (['ppt','pptx'].includes(ext)) return 'pptx';
                return 'other';

                                        <div className="text-xs text-gray-500">{doc.date} · {doc.size}</div>
                                    </div>
                                    <div className="flex gap-2 shrink-0">
                                        <a href={getDocDownloadUrl(doc)} download={doc.name} className="text-gray-600 text-xs border px-2 py-1 rounded hover:bg-gray-100">下载</a>
                                        <button onClick={() => handleDelete(doc)} className="text-red-500 text-xs border px-2 py-1 rounded hover:bg-red-50">删除</button>
                                    </div>
                                </div>

                    </div>
                    {previewDoc && (
                        <div className="fixed inset-0 z-[100] bg-black bg-opacity-75 flex items-center justify-center p-1 sm:p-4" onClick={(e) => { if (e.target === e.currentTarget) setPreviewDoc(null); }}>

                                    {previewDoc.fileType === 'pdf' && <PdfCanvasPreview sp={previewDoc.storagePath} url={previewDoc.url} />}
                                    {previewDoc.fileType === 'docx' && <DocxPreview sp={previewDoc.storagePath} url={previewDoc.url} />}

                            </div>

        // --- 教师端教材查看（只读：预览+下载） ---
        const TextbookViewer = ({ onBack }) => {
            const [docs, setDocs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [previewDoc, setPreviewDoc] = useState(null);
            useEffect(() => { (async () => { setLoading(true); setDocs(await DB.getDocs('__admin__', 'textbook')); setLoading(false); })(); }, []);
            const getFileType = (name) => {
                const ext = (name || '').split('.').pop().toLowerCase();
                if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(ext)) return 'image';
                if (['xls','xlsx'].includes(ext)) return 'excel';

                    <div className="flex-1 overflow-y-auto">

                    {previewDoc && (

                                    {previewDoc.fileType === 'excel' && <ExcelPreview sp={previewDoc.storagePath} url={previewDoc.url} />}
                                    {previewDoc.fileType === 'pdf' && <PdfCanvasPreview sp={previewDoc.storagePath} url={previewDoc.url} />}

        // --- 模拟测试及作业模块 ---
        const MockTestModule = ({ students, onSave, onClose, semester, className, teacherName }) => {
            const [batchField, setBatchField] = useState(null);
            const fieldLabels = { mock1:'模拟1', mock2:'模拟2', hw1:'作业1', hw2:'作业2' };
            const [localScores, setLocalScores] = useState({});
            const mockUserChanged = React.useRef(false);

            useEffect(() => {
                const init = {};
                students.forEach(s => { init[s.id] = { mock1: s.scores.mock1 || '', mock2: s.scores.mock2 || '', hw1: s.scores.hw1 || '', hw2: s.scores.hw2 || '' }; });
                setLocalScores(init);
            }, [students]);

            const handleChange = (sid, key, val) => {
                mockUserChanged.current = true;
                setLocalScores(prev => ({ ...prev, [sid]: { ...prev[sid], [key]: val } }));
            };

            // 自动保存（防抖500ms）
            const mockSaveTimer = React.useRef(null);
            const doSyncSave = React.useCallback((scores) => {
                const updates = students.map(s => {
                    const sc = scores[s.id];
                    if (!sc) return null;
                    return { id: s.id, scores: { ...s.scores, ...sc } };
                }).filter(Boolean);
                if (updates.length > 0) onSave(updates);
            }, [students, onSave]);

            useEffect(() => {
                if (!mockUserChanged.current) return;
                if (mockSaveTimer.current) clearTimeout(mockSaveTimer.current);
                mockSaveTimer.current = setTimeout(() => { doSyncSave(localScores); mockUserChanged.current = false; }, 500);
                return () => { if (mockSaveTimer.current) clearTimeout(mockSaveTimer.current); };
            }, [localScores, doSyncSave]);

            const handleClose = () => {
                if (mockSaveTimer.current) clearTimeout(mockSaveTimer.current);
                doSyncSave(localScores);
                onClose();
            };

            // 从批量录入弹窗返回时同步数据
            const handleBatchDone = (updates) => {
                onSave(updates);
                // 同步到 localScores
                setLocalScores(prev => {
                    const next = { ...prev };
                    updates.forEach(u => {
                        if (next[u.id]) {
                            next[u.id] = { ...next[u.id], mock1: u.scores.mock1 || '', mock2: u.scores.mock2 || '', hw1: u.scores.hw1 || '', hw2: u.scores.hw2 || '' };
                        }
                    });
                    return next;
                });
            };

            const handleExport = () => {
                const data = students.map((s, i) => ({
                    '序号': i + 1, '行政班级': s.adminClass, '学号': s.id, '姓名': s.name, '性别': s.gender,
                    '模拟1': localScores[s.id]?.mock1 || '', '模拟2': localScores[s.id]?.mock2 || '',
                    '作业1': localScores[s.id]?.hw1 || '', '作业2': localScores[s.id]?.hw2 || '',
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "模拟测试及作业");
                XLSX.writeFile(wb, `${semester}-模拟测试及作业-${className}-${teacherName}.xlsx`);
            };
            return (
                <div className="fixed inset-0 bg-white z-[50] flex flex-col">
                    <div className="p-4 shadow flex justify-between items-center bg-gray-50">
                        <div><h3 className="font-bold">模拟测试及作业</h3><p className="text-xs text-gray-500">可直接编辑 · 输入后自动保存 · 点击列标题可批量录入</p></div>
                        <div className="flex gap-2">
                            <button onClick={handleExport} className="bg-green-600 text-white px-3 py-1 rounded text-sm">导出Excel</button>
                            <button onClick={handleClose} className="text-gray-500 text-2xl">&times;</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-auto p-2">
                        <table className="min-w-full text-xs border-collapse">
                            <thead>
                                <tr className="bg-gray-100">
                                    <th className="border p-2 sticky left-0 bg-gray-100 z-10">姓名</th>
                                    <th className="border p-2">学号</th>
                                    {['mock1','mock2','hw1','hw2'].map(k => (
                                        <th key={k} className={`border p-2 cursor-pointer hover:bg-blue-100 ${k.startsWith('mock')?'bg-orange-50':'bg-blue-50'}`} onClick={() => setBatchField(k)}>
                                            <span className="text-blue-600 hover:underline">{fieldLabels[k]}</span>
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {students.map(s => (
                                    <tr key={s.id} className="hover:bg-gray-50">
                                        <td className="border p-1 font-medium sticky left-0 bg-white z-10">{s.name}</td>
                                        <td className="border p-1 text-gray-500">{s.id}</td>
                                        {['mock1','mock2','hw1','hw2'].map(k => (
                                            <td key={k} className="border p-1">
                                                <input type="number" className="w-full text-center p-1 border-0 outline-none focus:bg-blue-50 rounded" value={localScores[s.id]?.[k] || ''} onChange={e => handleChange(s.id, k, e.target.value)} />
                                            </td>
                                        ))}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    {batchField && <MockBatchModal students={students} field={batchField} fieldName={fieldLabels[batchField]} onClose={() => setBatchField(null)} onSave={handleBatchDone} />}
                </div>
            );
        };

        // --- 模拟/作业单项批量录入弹窗（自动保存） ---
        const MockBatchModal = ({ students, field, fieldName, onClose, onSave }) => {
            const [values, setValues] = useState(() => {
                const init = {};
                students.forEach(s => { init[s.id] = s.scores[field] || ''; });
                return init;
            });
            const mockUserChanged = React.useRef(false);
            const valuesRef = React.useRef(values);
            valuesRef.current = values;

            const handleChange = (sid, val) => {
                mockUserChanged.current = true;
                setValues(prev => ({ ...prev, [sid]: val }));
            };

            const doSave = React.useCallback(() => {
                const v = valuesRef.current;
                const updates = students.map(s => ({
                    id: s.id,
                    scores: { ...s.scores, [field]: v[s.id] !== undefined ? v[s.id] : s.scores[field] }
                }));
                onSave(updates);
            }, [students, field, onSave]);

            // 自动保存（防抖300ms）- 仅用户输入触发
            const saveTimerRef = React.useRef(null);
            useEffect(() => {
                if (!mockUserChanged.current) return;
                if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                saveTimerRef.current = setTimeout(() => { doSave(); mockUserChanged.current = false; }, 300);
                return () => { if (saveTimerRef.current) clearTimeout(saveTimerRef.current); };
            }, [values, doSave]);

            const handleClose = () => {
                if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                doSave();
                onClose();
            };
            return (
                <div className="fixed inset-0 bg-white z-[60] flex flex-col">
                    <div className="p-4 shadow flex justify-between items-center bg-orange-50">
                        <div><h3 className="font-bold">批量录入: {fieldName}</h3><p className="text-xs text-gray-500">输入后自动保存</p></div>
                        <button onClick={handleClose} className="text-2xl">&times;</button>
                    </div>
                    <div className="flex-1 overflow-auto p-4">
                        <table className="min-w-full text-sm">
                            <thead className="bg-gray-100"><tr><th className="p-2 text-left">姓名</th><th className="p-2 text-left">{fieldName}</th></tr></thead>
                            <tbody>{students.map(s => (
                                <tr key={s.id} className="border-b">
                                    <td className="p-2 font-medium">{s.name}</td>
                                    <td className="p-2"><input className="border p-2 rounded w-full" type="number" value={values[s.id] || ''} onChange={e => handleChange(s.id, e.target.value)} /></td>
                                </tr>
                            ))}</tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const AttendanceModule = ({ students, onSave, onClose, className, teacherName, semester }) => {
            const [mode, setMode] = useState('take'); 
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [records, setRecords] = useState({}); 

            useEffect(() => {
                const initRecs = {};
                students.forEach(s => {
                    const todayRec = s.attendance?.find(r => r.date === date);
                    initRecs[s.id] = todayRec || { status: 'normal', remark: '' };
                });
                setRecords(initRecs);
            }, [date, students]);

            const attendUserChanged = React.useRef(false);
            const handleStatusChange = (sid, status) => { attendUserChanged.current = true; setRecords(prev => ({ ...prev, [sid]: { ...prev[sid], status } })); };
            const handleRemarkChange = (sid, remark) => { attendUserChanged.current = true; setRecords(prev => ({ ...prev, [sid]: { ...prev[sid], remark } })); };

            // 自动保存考勤（防抖500ms）- 仅用户操作触发
            const attendSaveTimer = React.useRef(null);
            const saveAttendance = React.useCallback(() => {
                const updates = students.map(s => {
                    const newRec = { date, ...records[s.id] };
                    const prevAtt = s.attendance || [];
                    const filtered = prevAtt.filter(r => r.date !== date);
                    return { id: s.id, attendance: [...filtered, newRec] };
                });
                onSave(updates);
            }, [students, records, date, onSave]);
            useEffect(() => {
                if (!attendUserChanged.current) return;
                if (attendSaveTimer.current) clearTimeout(attendSaveTimer.current);
                attendSaveTimer.current = setTimeout(() => { saveAttendance(); attendUserChanged.current = false; }, 500);
                return () => { if (attendSaveTimer.current) clearTimeout(attendSaveTimer.current); };
            }, [records, saveAttendance]);

            const exportAttendance = () => {
                const allDates = new Set();
                students.forEach(s => (s.attendance || []).forEach(r => allDates.add(r.date)));
                const sortedDates = Array.from(allDates).sort();
                const formatDate = (d) => { const parts = d.split('-'); return parseInt(parts[1]) + '.' + parseInt(parts[2]); };
                const data = students.map((s, i) => {
                    const row = { '序号': i+1, '行政班级': s.adminClass, '学号': s.id, '姓名': s.name, '性别': s.gender };
                    sortedDates.forEach(d => {
                        const rec = (s.attendance || []).find(r => r.date === d);
                        if (!rec || rec.status === 'normal') row[formatDate(d)] = '';
                        else if (rec.status === 'other') row[formatDate(d)] = rec.remark || '备注';
                        else row[formatDate(d)] = ATTENDANCE_STATUS[rec.status].symbol;
                    });
                    return row;
                });
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "考勤表");
                XLSX.writeFile(wb, `${semester}-考勤表-${className}-${teacherName}.xlsx`);
            };

            if (mode === 'view') {
                return (
                    <div className="p-4 bg-white h-full flex flex-col">
                        <div className="flex justify-between mb-4">
                            <h3 className="font-bold">考勤记录</h3>
                            <div className="gap-2 flex">
                                <button onClick={exportAttendance} className="bg-green-600 text-white px-3 py-1 rounded text-sm">导出Excel</button>
                                <button onClick={() => setMode('take')} className="text-blue-600 border px-3 py-1 rounded text-sm">返回打卡</button>
                            </div>
                        </div>
                        <div className="overflow-auto flex-1 border rounded">
                            <table className="min-w-full text-xs">
                                <thead className="bg-gray-50 sticky top-0"><tr><th className="p-2">姓名</th><th className="p-2">异常统计</th></tr></thead>
                                <tbody>
                                    {students.map(s => (
                                        <tr key={s.id} className="border-t">
                                            <td className="p-2">{s.name}</td>
                                            <td className="p-2 text-gray-500">{getAttendanceSummary(s.attendance)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 bg-white h-full flex flex-col">
                    <div className="flex justify-between items-center mb-4">
                        <div className="flex items-center gap-2">
                            <h3 className="font-bold">考勤打卡</h3>
                            <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="border rounded p-1 text-sm"/>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setMode('view')} className="text-blue-600 text-sm">查看/导出</button>
                            <button onClick={onClose} className="text-gray-500 text-2xl">&times;</button>

                    <div className="overflow-y-auto flex-1 hide-scrollbar">
                        {students.map(s => (
                            <div key={s.id} className="border-b py-2">
                                <div className="flex justify-between mb-2">
                                    <span className="font-bold">{s.name}</span>
                                    <span className="text-gray-400 text-xs">{s.id}</span>
                                </div>
                                <div className="flex flex-wrap gap-2 text-xs">
                                    {Object.entries(ATTENDANCE_STATUS).map(([key, cfg]) => (
                                        <button key={key} onClick={() => handleStatusChange(s.id, key)} className={`px-2 py-1 rounded border ${records[s.id]?.status === key ? `${cfg.color} border-current bg-blue-50` : 'text-gray-500 border-gray-200'}`}>{cfg.label}</button>
                                    ))}
                                </div>
                                {records[s.id]?.status === 'other' && <input className="mt-2 w-full border rounded p-1 text-xs" placeholder="输入备注..." value={records[s.id]?.remark || ''} onChange={(e) => handleRemarkChange(s.id, e.target.value)} />}
                            </div>
                        ))}
                    </div>
                    <div className="pt-4 border-t mt-2">
                        <p className="text-center text-xs text-gray-400">考勤操作后自动保存</p>
                    </div>
                </div>
            );
        };

        const BatchStdEntryModal = ({ students, trialIndex, itemKey, itemName, onClose, onSave }) => {
            const [values, setValues] = useState({});
            const batchStdUserChanged = React.useRef(false);
            useEffect(() => {
                const init = {};
                students.forEach(s => { init[s.id] = (s.stdTestRecords?.[itemKey] || [])[trialIndex] || ""; });
                setValues(init);
            }, [students, trialIndex, itemKey]);
            const handleChange = (sid, val) => { batchStdUserChanged.current = true; setValues(prev => ({ ...prev, [sid]: val })); };
            
            const doSave = React.useCallback((vals) => {
                const updates = students.map(s => {
                    const currentRecords = s.stdTestRecords?.[itemKey] || ["", "", ""];
                    const newRecords = [...currentRecords];
                    newRecords[trialIndex] = vals[s.id];
                    return { id: s.id, [itemKey]: newRecords };
                });
                onSave(updates, itemKey);
            }, [students, itemKey, trialIndex, onSave]);

            // 自动保存（防抖500ms）- 仅用户输入触发
            const saveTimer = React.useRef(null);
            useEffect(() => {
                if (!batchStdUserChanged.current) return;
                if (saveTimer.current) clearTimeout(saveTimer.current);
                saveTimer.current = setTimeout(() => { doSave(values); batchStdUserChanged.current = false; }, 500);
                return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
            }, [values, doSave]);

            const handleClose = () => {
                if (saveTimer.current) clearTimeout(saveTimer.current);
                doSave(values);
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-white z-[60] flex flex-col">
                    <div className="p-4 shadow flex justify-between items-center bg-blue-50">
                        <div><h3 className="font-bold">批量录入: {itemName}</h3><p className="text-xs text-gray-500">第 {trialIndex + 1} 次测试 · 输入后自动保存</p></div>
                        <button onClick={handleClose} className="text-2xl">&times;</button>
                    </div>
                    <div className="flex-1 overflow-auto p-4">
                        <table className="min-w-full text-sm"><thead className="bg-gray-100"><tr><th className="p-2 text-left">姓名</th><th className="p-2 text-left">成绩</th></tr></thead>
                        <tbody>{students.map(s => (<tr key={s.id} className="border-b"><td className="p-2">{s.name}</td><td className="p-2"><input className="border p-2 rounded w-full" value={values[s.id] || ''} onChange={e => handleChange(s.id, e.target.value)} type="text" inputMode="decimal"/></td></tr>))}</tbody></table>
                    </div>
                </div>
            );
        };

        const StdTestModule = ({ students, onSave, onClose, semester, className, teacherName }) => {
            const semType = getSemesterType(semester);
            const testInfo = getTestItemsName(semType, '男');
            const [localRecs, setLocalRecs] = useState({});
            const [batchModalInfo, setBatchModalInfo] = useState(null); 

            useEffect(() => {
                const init = {};
                students.forEach(s => { init[s.id] = { item1: s.stdTestRecords?.item1 || ["", "", ""], item2: s.stdTestRecords?.item2 || ["", "", ""] }; });
                setLocalRecs(init);
            }, [students]);

            const stdUserChanged = React.useRef(false);
            const handleChange = (sid, itemKey, idx, val) => {
                stdUserChanged.current = true;
                setLocalRecs(prev => {
                    const newList = [...prev[sid][itemKey]];
                    newList[idx] = val;
                    return { ...prev, [sid]: { ...prev[sid], [itemKey]: newList } };
                });
            };

            const handleBatchSave = (updates, itemKey) => {
                stdUserChanged.current = true;
                setLocalRecs(prev => {
                    const next = { ...prev };
                    updates.forEach(u => {
                        const sid = u.id;
                        const newRecords = u[itemKey];
                        if (next[sid]) next[sid] = { ...next[sid], [itemKey]: newRecords };
                    });
                    return next;
                });
            };

            // 自动保存统考记录（防抖800ms）+ 同步最优成绩 - 仅用户操作触发
            const stdSaveTimer = React.useRef(null);
            const syncAndSave = React.useCallback((recs) => {
                const updates = students.map(s => {
                    const rec = recs[s.id];
                    if (!rec) return null;
                    const info = getTestItemsName(semType, s.gender);
                    const best1 = getBestRecord(rec.item1, info.type1);
                    const best2 = getBestRecord(rec.item2, info.type2);
                    const score1 = calculateStdTestScore(best1, info.item1, s.gender);
                    const score2 = calculateStdTestScore(best2, info.item2, s.gender);
                    return { id: s.id, stdTestRecords: rec, scores: { ...s.scores, rawItem1: best1, rawItem2: best2, stdItem1: score1 !== null ? score1 : 0, stdItem2: score2 !== null ? score2 : 0 } };
                }).filter(Boolean);
                if (updates.length > 0) onSave(updates);
            }, [students, semType, onSave]);

            useEffect(() => {
                if (!stdUserChanged.current) return;
                if (Object.keys(localRecs).length === 0) return;
                if (stdSaveTimer.current) clearTimeout(stdSaveTimer.current);
                stdSaveTimer.current = setTimeout(() => { syncAndSave(localRecs); stdUserChanged.current = false; }, 800);
                return () => { if (stdSaveTimer.current) clearTimeout(stdSaveTimer.current); };
            }, [localRecs, syncAndSave]);

            const handleClose = () => {
                if (stdSaveTimer.current) clearTimeout(stdSaveTimer.current);
                syncAndSave(localRecs);
                onClose();
            };

            const handleExportStd = () => {
                const data = students.map((s, index) => {
                    const rec = localRecs[s.id] || { item1:[], item2:[] };
                    const info = getTestItemsName(semType, s.gender);
                    const best1 = getBestRecord(rec.item1, info.type1);
                    const best2 = getBestRecord(rec.item2, info.type2);
                    return {
                        '序号': index + 1, '行政班级': s.adminClass, '学号': s.id, '姓名': s.name, '性别': s.gender,
                        [`${info.display1}(1)`]: rec.item1[0], [`${info.display1}(2)`]: rec.item1[1], [`${info.display1}(3)`]: rec.item1[2], [`${info.display1}(最好)`]: best1,
                        [`${info.display2}(1)`]: rec.item2[0], [`${info.display2}(2)`]: rec.item2[1], [`${info.display2}(3)`]: rec.item2[2], [`${info.display2}(最好)`]: best2,
                    };
                });
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "统考记录");
                XLSX.writeFile(wb, `${semester}-统考记录-${className}-${teacherName}.xlsx`);
            };

            return (
                <div className="fixed inset-0 bg-white z-[50] flex flex-col">
                    <div className="p-4 shadow flex justify-between items-center bg-gray-50">
                        <div><h3 className="font-bold">统考详细记录</h3><p className="text-xs text-gray-500">自动选取最优成绩 · 输入后自动保存</p></div>
                        <div className="flex gap-2">
                            <button onClick={handleExportStd} className="bg-green-600 text-white px-3 py-1 rounded text-sm">导出Excel</button>
                            <button onClick={handleClose} className="text-gray-500 text-2xl">&times;</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-auto p-2">
                        <table className="min-w-full text-xs border-collapse">
                            <thead>
                                <tr className="bg-blue-50">
                                    <th className="border p-2 sticky left-0 bg-blue-50 w-20">姓名</th>
                                    <th className="border p-2 text-center" colSpan="3">
                                        <div className="mb-1">{testInfo.display1}</div>
                                        <div className="flex justify-around">
                                            {[0,1,2].map(i => (<button key={i} onClick={() => setBatchModalInfo({itemKey:'item1', trialIndex:i, itemName:testInfo.display1})} className="text-blue-600 hover:underline">第{i+1}次</button>))}
                                        </div>
                                    </th>
                                    <th className="border p-2 text-center" colSpan="3">
                                        <div className="mb-1">{testInfo.display2}</div>
                                        <div className="flex justify-around">
                                            {[0,1,2].map(i => (<button key={i} onClick={() => setBatchModalInfo({itemKey:'item2', trialIndex:i, itemName:testInfo.display2})} className="text-blue-600 hover:underline">第{i+1}次</button>))}
                                        </div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                {students.map(s => (
                                    <tr key={s.id}>
                                        <td className="border p-2 font-bold sticky left-0 bg-white">{s.name}</td>
                                        {[0,1,2].map(i => (<td key={`i1-${i}`} className="border p-1"><input className="w-full text-center p-1" value={localRecs[s.id]?.item1[i] || ''} onChange={e=>handleChange(s.id, 'item1', i, e.target.value)} /></td>))}
                                        {[0,1,2].map(i => (<td key={`i2-${i}`} className="border p-1"><input className="w-full text-center p-1" value={localRecs[s.id]?.item2[i] || ''} onChange={e=>handleChange(s.id, 'item2', i, e.target.value)} /></td>))}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    {batchModalInfo && <BatchStdEntryModal students={students} {...batchModalInfo} onClose={() => setBatchModalInfo(null)} onSave={handleBatchSave}/>}
                </div>
            );
        };

        const BatchEntryTable = ({ students, field, fieldName, semester, config, onBatchSave }) => {
            return (
                <div className="overflow-x-auto bg-white rounded-lg shadow border border-gray-200">
                    <table className="min-w-full divide-y divide-gray-200">
                        <thead className="bg-gray-50">
                            <tr>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">姓名</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">学号</th>
                                <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    {(field === 'stdItem1' || field === 'stdItem2' || field === 'special1' || field === 'special2') ? `${fieldName} (原始成绩 -> 折算分)` : `${fieldName} (输入后自动保存)`}
                                </th>
                            </tr>
                        </thead>
                        <tbody className="bg-white divide-y divide-gray-200">
                            {students.map(s => (
                                <BatchRow key={s.id} student={s} field={field} semester={semester} config={config} onSave={onBatchSave} />
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        const BatchRow = React.memo(({ student, field, semester, config, onSave }) => {
            const isStdItem = field === 'stdItem1' || field === 'stdItem2';
            const isSpecItem = field === 'special1' || field === 'special2';
            let rawKey = null;
            let actualBindKey = field;
            let needsCalc = false;
            
            if (isStdItem) {
                rawKey = field === 'stdItem1' ? 'rawItem1' : 'rawItem2';
                actualBindKey = rawKey;
                needsCalc = true;
            } else if (isSpecItem) {
                const specConf = field === 'special1' ? config?.spec1 : config?.spec2;
                if (specConf && specConf.type !== 'score') {
                    rawKey = field === 'special1' ? 'rawSpec1' : 'rawSpec2';
                    actualBindKey = rawKey;
                    needsCalc = true;
                }
            }

            const [val, setVal] = useState(student.scores[actualBindKey]);
            const [focused, setFocused] = useState(false);
            useEffect(() => { setVal(student.scores[actualBindKey]); }, [actualBindKey, student.scores]);

            const handleChange = (e) => {
                const newValue = e.target.value;
                setVal(newValue);
                if (isStdItem) {
                    const semType = getSemesterType(semester);
                    const testNames = getTestItemsName(semType, student.gender);
                    const itemName = field === 'stdItem1' ? testNames.item1 : testNames.item2;
                    const calcScore = calculateStdTestScore(newValue, itemName, student.gender);
                    onSave(student.id, { [rawKey]: newValue, [field]: calcScore !== null ? calcScore : 0 });
                } else if (isSpecItem && needsCalc) {
                    const specConf = field === 'special1' ? config.spec1 : config.spec2;
                    const calcScore = calculateSpecialtyScore(newValue, student.gender, specConf);
                    onSave(student.id, { [rawKey]: newValue, [field]: calcScore !== null ? calcScore : 0 });
                } else {
                    onSave(student.id, { [field]: newValue });
                }
            };
            
            let displayScore = 0;
            if (needsCalc) {
                if (isStdItem) {
                    const semType = getSemesterType(semester);
                    const testNames = getTestItemsName(semType, student.gender);
                    const itemName = field === 'stdItem1' ? testNames.item1 : testNames.item2;
                    displayScore = calculateStdTestScore(val, itemName, student.gender);
                } else if (isSpecItem) {
                     const specConf = field === 'special1' ? config?.spec1 : config?.spec2;
                     displayScore = calculateSpecialtyScore(val, student.gender, specConf);
                }
            }

            // 提示信息
            let hintContent = null;
            if (focused && field === 'regular1') {
                const hint = getAttendanceSummary(student.attendance);
                if (hint !== "无考勤记录") {
                    const isGood = hint.includes('无异常');
                    hintContent = <div className={`absolute left-0 bottom-full mb-1 text-xs p-2 rounded shadow-lg z-50 whitespace-nowrap ${isGood ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{hint}</div>;
                }
            }
            if (focused && field === 'regular2') {
                const sc = student.scores;
                const m1 = parseFloat(sc.mock1) || 0, m2 = parseFloat(sc.mock2) || 0;
                const h1 = parseFloat(sc.hw1) || 0, h2 = parseFloat(sc.hw2) || 0;
                hintContent = <div className="absolute left-0 bottom-full mb-1 text-xs p-2 rounded shadow-lg z-50 bg-blue-100 text-blue-800" style={{maxWidth:'min(90vw, 320px)', lineHeight:'1.6'}}>模拟1: {m1} | 模拟2: {m2} | 模拟均分: {(m1+m2)/2}<br/>作业1: {h1} | 作业2: {h2} | 作业均分: {(h1+h2)/2}</div>;
            }

            return (
                <tr>
                    <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{student.name}</td>
                    <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{student.id}</td>
                    <td className="px-6 py-4 whitespace-nowrap">
                        <div className="relative flex items-center gap-2">
                            <input type={needsCalc ? "text" : "number"} placeholder={needsCalc ? "原始成绩" : ""} className="input-cell w-32 border border-gray-300 rounded px-2 py-1" value={val || ''} onChange={handleChange} onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} />
                            {needsCalc && <span className="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">{displayScore || 0}分</span>}
                            {hintContent}
                        </div>
                    </td>
                </tr>
            );
        });

        const GradingModal = ({ student, semester, onClose, onSave, specialtyConfig, sportsList }) => {
            const [scores, setScores] = useState({ ...student.scores });
            const [focusedField, setFocusedField] = useState(null); 
            const matchedSport = useMemo(() => sportsList.find(s => student.optionClass?.includes(s)) || sportsList[0], [student.optionClass, sportsList]);
            const [sport, setSport] = useState(matchedSport);
            const config = specialtyConfig[sport] || { spec1: {type:'score'}, spec2: {type:'score'} };
            const [specInputs, setSpecInputs] = useState({ rawSpec1: student.scores.rawSpec1 || '', rawSpec2: student.scores.rawSpec2 || '' });
            const semType = getSemesterType(semester);
            const testNames = getTestItemsName(semType, student.gender);
            const attendanceHint = getAttendanceSummary(student.attendance);

            // Auto-save logic
            useEffect(() => {
                const timer = setTimeout(() => {
                    onSave(student.id, { ...scores, rawSpec1: specInputs.rawSpec1, rawSpec2: specInputs.rawSpec2 });
                }, 500); // Debounce save
                return () => clearTimeout(timer);
            }, [scores, specInputs, onSave, student.id]);

            const updateScore = (field, value) => setScores(prev => ({ ...prev, [field]: value }));
            const handleSpecInput = (specKey, val) => {
                setSpecInputs(prev => ({ ...prev, [specKey]: val }));
                const specConf = specKey === 'rawSpec1' ? config.spec1 : config.spec2;
                const scoreField = specKey === 'rawSpec1' ? 'special1' : 'special2';
                const score = calculateSpecialtyScore(val, student.gender, specConf);
                updateScore(scoreField, score);
            };
            const handleClose = () => { 
                onClose(); 
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-xl w-full max-w-lg shadow-2xl flex flex-col max-h-[90vh] relative z-[101]">
                        <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                            <div><h3 className="font-bold">{student.name}</h3><p className="text-xs text-gray-500">{student.id} | {student.gender} | {student.optionClass}</p></div>
                            <button onClick={handleClose} className="text-2xl ml-2">&times;</button>
                        </div>
                        <div className="p-6 overflow-y-auto hide-scrollbar space-y-6">
                            <div className="bg-orange-50 p-4 rounded border border-orange-100">
                                <div className="flex justify-between mb-2 items-center">
                                    <h4 className="font-bold text-orange-800 text-sm">专项考核 ({sport})</h4>
                                    <select className="text-xs border p-1 rounded" value={sport} onChange={e=>setSport(e.target.value)}>{sportsList.map(s => <option key={s} value={s}>{s}</option>)}</select>
                                </div>
                                {scores.swapTeacher && <div className="text-xs text-green-700 bg-green-50 px-2 py-1 rounded mb-2">换考教师：{scores.swapTeacher}</div>}
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs text-gray-600 block mb-1">专项1 ({config.spec1?.type === 'score' ? '分值' : config.spec1?.type})</label>
                                        <input type="number" placeholder={config.spec1?.type === 'score' ? '0-100' : '原始数据'} className="w-full border p-2 rounded focus:ring-2 ring-orange-300" value={(config.spec1?.type === 'score' ? scores.special1 : specInputs.rawSpec1) || ''} onChange={e => { if(config.spec1?.type === 'score') updateScore('special1', e.target.value); else handleSpecInput('rawSpec1', e.target.value); }} />
                                        {config.spec1?.type !== 'score' && <div className="text-xs text-right text-orange-600 mt-1">折算: {scores.special1}分</div>}
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-600 block mb-1">专项2 ({config.spec2?.type === 'score' ? '分值' : config.spec2?.type})</label>
                                        <input type="number" placeholder={config.spec2?.type === 'score' ? '0-100' : '原始数据'} className="w-full border p-2 rounded focus:ring-2 ring-orange-300" value={(config.spec2?.type === 'score' ? scores.special2 : specInputs.rawSpec2) || ''} onChange={e => { if(config.spec2?.type === 'score') updateScore('special2', e.target.value); else handleSpecInput('rawSpec2', e.target.value); }} />
                                        {config.spec2?.type !== 'score' && <div className="text-xs text-right text-orange-600 mt-1">折算: {scores.special2}分</div>}
                                    </div>
                                </div>
                            </div>
                            <div className="bg-blue-50 p-4 rounded text-xs text-blue-800">
                                <h4 className="font-bold mb-2">统考成绩 (请在"统考记录"模块录入)</h4>
                                <div className="flex justify-between">
                                    <span>{testNames.display1}: <strong>{scores.rawItem1 || '-'}</strong> -> <strong>{calculateStdTestScore(scores.rawItem1, testNames.item1, student.gender)}分</strong></span>
                                    <span>{testNames.display2}: <strong>{scores.rawItem2 || '-'}</strong> -> <strong>{calculateStdTestScore(scores.rawItem2, testNames.item2, student.gender)}分</strong></span>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="relative">
                                    <label className="text-xs text-gray-500">平时1</label>
                                    <input 
                                        type="number" className="w-full border p-2 rounded" 
                                        value={scores.regular1 || ''} onChange={(e) => updateScore('regular1', e.target.value)} 
                                        onFocus={() => setFocusedField('regular1')} onBlur={() => setFocusedField(null)}
                                    />
                                    {focusedField === 'regular1' && attendanceHint !== "无考勤记录" && (
                                        <div className={`absolute left-0 bottom-full mb-1 text-xs p-2 rounded shadow-lg z-50 whitespace-nowrap ${attendanceHint.includes('无异常') ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                            {attendanceHint}
                                        </div>
                                    )}
                                </div>
                                <div className="relative">
                                    <label className="text-xs text-gray-500">平时2</label>
                                    <input type="number" className="w-full border p-2 rounded" 
                                        value={scores.regular2 || ''} onChange={(e) => updateScore('regular2', e.target.value)}
                                        onFocus={() => setFocusedField('regular2')} onBlur={() => setFocusedField(null)}
                                    />
                                    {focusedField === 'regular2' && (
                                        <div className="absolute left-0 bottom-full mb-1 text-xs p-2 rounded shadow-lg z-50 bg-blue-100 text-blue-800" style={{maxWidth:'min(90vw, 320px)', lineHeight:'1.6'}}>
                                            模拟1: {parseFloat(scores.mock1)||0} | 模拟2: {parseFloat(scores.mock2)||0} | 模拟均分: {((parseFloat(scores.mock1)||0)+(parseFloat(scores.mock2)||0))/2}<br/>
                                            作业1: {parseFloat(scores.hw1)||0} | 作业2: {parseFloat(scores.hw2)||0} | 作业均分: {((parseFloat(scores.hw1)||0)+(parseFloat(scores.hw2)||0))/2}
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-xs text-gray-500">乐跑次数</label><input type="number" className="w-full border p-2 rounded bg-gray-50" value={scores.runCount || ''} onChange={(e) => updateScore('runCount', e.target.value)} /></div>
                                <div><label className="text-xs text-gray-500">乐跑得分</label><input type="number" className="w-full border p-2 rounded" value={scores.runScore || ''} onChange={(e) => updateScore('runScore', e.target.value)} /></div>
                            </div>
                            {semType === 'spring' && (<div><label className="text-xs text-gray-500">理论</label><input type="number" className="w-full border p-2 rounded" value={scores.theory || ''} onChange={(e) => updateScore('theory', e.target.value)} /></div>)}
                        </div>
                        <div className="p-4 border-t flex justify-between items-center bg-gray-50 rounded-b-xl">
                            <span className="font-bold text-lg text-blue-600">总评: {calculateFinalScore({ ...scores, stdItem1: calculateStdTestScore(scores.rawItem1, testNames.item1, student.gender), stdItem2: calculateStdTestScore(scores.rawItem2, testNames.item2, student.gender) }, semType)}</span>
                            <button onClick={handleClose} className="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">关闭 (自动保存)</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminEditModal = ({ student, onClose, onSave, mode = 'full' }) => {
            const [form, setForm] = useState({ ...student, ...student.scores });
            const handleSave = () => {
                let updates = {};
                if (mode === 'full') { updates = { optionClass: form.optionClass, teacherName: form.teacherName }; } 
                else if (mode === 'run') { updates = { scores: { ...student.scores, runCount: form.runCount, runScore: form.runScore, isRunFailed: form.isRunFailed } }; } 
                else if (mode === 'theory') { updates = { scores: { ...student.scores, theory: form.theory } }; }
                onSave(student.id, updates);
            };
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-xl w-full max-w-md shadow-2xl p-6 relative z-[101]">
                        <h3 className="text-lg font-bold mb-4">修改信息 ({student.name})</h3>
                        <div className="space-y-4">
                            {mode === 'full' && (<><div><label className="text-xs">选项班</label><input className="w-full border p-2 rounded" value={form.optionClass} onChange={e => setForm({...form, optionClass: e.target.value})} /></div><div><label className="text-xs">任课教师</label><input className="w-full border p-2 rounded" value={form.teacherName} onChange={e => setForm({...form, teacherName: e.target.value})} /></div></>)}
                            {mode === 'run' && (<><div><label className="text-xs">乐跑次数</label><input type="number" className="w-full border p-2 rounded" value={form.runCount} onChange={e => setForm({...form, runCount: e.target.value})} /></div><div><label className="text-xs">乐跑成绩</label><input type="number" className="w-full border p-2 rounded" value={form.runScore} onChange={e => setForm({...form, runScore: e.target.value})} /></div><div className="flex items-center gap-2"><input type="checkbox" checked={form.isRunFailed} onChange={e => setForm({...form, isRunFailed: e.target.checked})} /><label className="text-xs">不合格标记</label></div></>)}
                            {mode === 'theory' && (<div><label className="text-xs">理论成绩</label><input type="number" className="w-full border p-2 rounded" value={form.theory} onChange={e => setForm({...form, theory: e.target.value})} /></div>)}
                        </div>
                        <div className="mt-6 flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 text-gray-600">取消</button><button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded">保存</button></div>
                    </div>
                </div>
            );
        };
        
        const AdminTable = ({ students, columns, onDelete, onEdit }) => {
            return (
                 <div className="flex-1 overflow-auto border rounded relative">
                    <table className="min-w-full text-xs divide-y">
                        <thead className="bg-gray-50 sticky top-0 z-10">
                            <tr>{columns.map(col => <th key={col.key} className="p-2 text-left">{col.label}</th>)}<th className="p-2 text-center">操作</th></tr>
                        </thead>
                        <tbody className="divide-y bg-white">
                            {students.map(s => (<tr key={s.id}>{columns.map(col => <td key={col.key} className="p-2">{col.render ? col.render(s) : s[col.key]}</td>)}<td className="p-2 text-center flex justify-center gap-2"><button onClick={() => onEdit(s)} className="text-blue-600">编辑</button><button onClick={() => onDelete(s.id)} className="text-red-500">删除</button></td></tr>))}
                        </tbody>
                    </table>
                </div>
            );
        };

        const AdminPanel = ({ students, setStudents, teachers, setTeachers, semester, setSemester, onLogout, sportsList, setSportsList, config, setConfig }) => {
            const [activeTab, setActiveTab] = useState('data');
            const [searchTerm, setSearchTerm] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const [editModal, setEditModal] = useState(null);
            const [jumpPage, setJumpPage] = useState('');
            const itemsPerPage = 20;
            const semesterOptions = getSemesterOptions();

            const semesterStudents = useMemo(() => students.filter(s => s.semester === semester), [students, semester]);
            const filteredStudents = useMemo(() => {
                if (!searchTerm) return semesterStudents;
                const lower = searchTerm.toLowerCase();
                return semesterStudents.filter(s => s.id.includes(lower) || s.name.includes(lower));
            }, [semesterStudents, searchTerm]);

            const [currentPageState, setCurrentPageState] = useState(1);
            useEffect(() => setCurrentPageState(1), [searchTerm, activeTab]);
            const paginatedData = useMemo(() => {
                const start = (currentPageState - 1) * itemsPerPage;
                return filteredStudents.slice(start, start + itemsPerPage);
            }, [filteredStudents, currentPageState]);
            const totalPages = Math.ceil(filteredStudents.length / itemsPerPage);

            const handleFileUpload = (e, type) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsname = wb.SheetNames[0];
                    const ws = wb.Sheets[wsname];
                    const data = XLSX.utils.sheet_to_json(ws);
                    if (data.length === 0) { alert("表格为空"); return; }
                    
                    if (type === 'students') {
                        processStudentData(data);
                    } else if (type === 'run') {
                        processRunData(data);
                    } else if (type === 'teachers') {
                        processTeacherData(data);
                    } else if (type === 'theory') {
                        processTheoryData(data);
                    }
                    e.target.value = '';
                };
                reader.readAsBinaryString(file);
            };

            const processStudentData = (data) => {
                const newStudents = data.map(row => ({
                    id: String(row['学号'] || row['id']).trim(),
                    name: row['姓名'],
                    gender: row['性别'],
                    adminClass: row['行政班级'],
                    optionClass: row['体育课选项班'] || row['上课班级'] || '未分配班级',
                    teacherName: row['体育课任课教师'] || '',
                    semester: semester, 
                    scores: { regular1:'', regular2:'', special1:'', special2:'', runCount:'', runScore:'', stdItem1:'', stdItem2:'', theory:'', mock1:'', mock2:'', hw1:'', hw2:'' } 
                }));
                setStudents(prev => {
                    const others = prev.filter(s => s.semester !== semester);
                    const current = prev.filter(s => s.semester === semester);
                    newStudents.forEach(ns => {
                         const idx = current.findIndex(s => s.id === ns.id);
                         if (idx >= 0) current[idx] = { ...current[idx], ...ns, scores: current[idx].scores };
                         else current.push(ns);
                    });
                    return [...others, ...current];
                });
                alert("导入完成");
            };

            const processRunData = (data) => {
                setStudents(prev => prev.map(s => {
                    if (s.semester !== semester) return s;
                    const record = data.find(r => String(r['学号']||'').trim() === s.id);
                    if (record) {
                        const val = record['达成度评价表录入百分制成绩'];
                        const isFail = String(val).trim() === '不合格';
