                        return { ...s, scores: { ...s.scores, runCount: record['乐跑总次数']||0, runScore: isFail ? 0 : (parseFloat(val)||0), isRunFailed: isFail } };
                    }
                    return s;
                }));
                alert("乐跑数据导入完成");
            };

            const processTheoryData = (data) => {
                setStudents(prev => prev.map(s => {
                    if (s.semester !== semester) return s;
                    const studentId = String(s.id).trim();
                    const record = data.find(r => {
                        const rowId = String(r['学号'] || r['id'] || r['ID'] || '').trim();
                        return rowId === studentId;
                    });
                    
                    if (record) {
                        let val = '';
                        if (record['得分'] !== undefined) val = record['得分'];
                        else if (record['理论成绩'] !== undefined) val = record['理论成绩'];
                        else if (record['理论'] !== undefined) val = record['理论'];
                        
                        return { ...s, scores: { ...s.scores, theory: val === '' ? '' : parseFloat(val) } };
                    }
                    return s;
                }));
                alert("理论成绩导入完成");
            };
            
            const processTeacherData = (data) => {
                const newTeachers = data.map(r => ({ name: r['姓名'], id: String(r['工号']) }));
                setTeachers(newTeachers);
                alert("教师导入完成");
            };

            const handleDeleteRow = (studentId) => {
                if (activeTab === 'data') {
                    if(confirm("确定删除该学生及其所有成绩吗？")) {
                         setStudents(prev => prev.filter(s => !(s.id === studentId && s.semester === semester)));
                         DB.deleteStudent(studentId, semester);
                    }
                } else if (activeTab === 'run') {
                    if(confirm("确定清除该学生的乐跑成绩吗？")) {
                         setStudents(prev => prev.map(s => {
                             if (s.id === studentId && s.semester === semester) {
                                 return { ...s, scores: { ...s.scores, runCount: 0, runScore: 0, isRunFailed: false } };
                             }
                             return s;
                         }));
                    }
                } else if (activeTab === 'theory') {
                     if(confirm("确定清除该学生的理论成绩吗？")) {
                         setStudents(prev => prev.map(s => {
                             if (s.id === studentId && s.semester === semester) {
                                 return { ...s, scores: { ...s.scores, theory: '' } };
                             }
                             return s;
                         }));
                    }
                }
            };

            const handleClearAllStudents = () => {
                if(!confirm(`⚠️ 高危操作：确定清空【${semester}】的所有学生数据吗？\n此操作将删除该学期下的学生名单、所有成绩、考勤记录。\n且无法恢复！`)) return;
                setStudents(prev => prev.filter(s => s.semester !== semester));
                DB.deleteStudentsBySemester(semester);
                alert("本学期学生数据已清空");
            };

            const handleClearCategory = (category) => {
                const catName = category === 'run' ? '乐跑' : '理论';
                if (!confirm(`确定清空本学期所有学生的 ${catName} 数据吗？此操作不可撤销！`)) return;
                setStudents(prev => prev.map(s => {
                    if (s.semester !== semester) return s;
                    const newScores = { ...s.scores };
                    if (category === 'run') { newScores.runCount = 0; newScores.runScore = 0; newScores.isRunFailed = false; }
                    if (category === 'theory') { newScores.theory = ''; }
                    return { ...s, scores: newScores };
                }));
                alert(`${catName}数据已清空`);
            };

            const handleSaveEdit = (id, updates) => {
                setStudents(prev => prev.map(s => {
                    if (s.id === id && s.semester === semester) {
                         if (updates.scores) return { ...s, scores: { ...s.scores, ...updates.scores } };
                         return { ...s, ...updates };
                    }
                    return s;
                }));
                setEditModal(null);
            };

            const handleJump = () => { const page = parseInt(jumpPage); if (page >= 1 && page <= totalPages) { setCurrentPageState(page); setJumpPage(''); } else { alert(`请输入 1 到 ${totalPages} 之间的页码`); } };

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col">
                    <header className="bg-white shadow p-4 flex justify-between items-center">
                        <div className="flex items-center gap-4"><h1 className="font-bold">管理员后台</h1><div className="flex items-center gap-2"><span className="text-xs text-gray-500">学期:</span><select value={semester} onChange={(e) => setSemester(e.target.value)} className="border rounded px-1 text-xs">{semesterOptions.map(opt => (<option key={opt} value={opt}>{opt}</option>))}</select></div></div>
                        <button onClick={onLogout} className="text-red-500 text-sm">退出</button>
                    </header>
                    <div className="flex-1 p-4 overflow-hidden flex flex-col">
                        <div className="flex space-x-2 mb-4 overflow-x-auto">{['data', 'standards', 'teachers', 'textbook', 'run', 'theory'].map(t => (<button key={t} onClick={()=>setActiveTab(t)} className={`px-3 py-1 rounded whitespace-nowrap ${activeTab===t?'bg-blue-600 text-white':'bg-white text-sm'}`}>{t==='data'?'学生数据':t==='standards'?'专项标准':t==='teachers'?'教师管理':t==='textbook'?'教材管理':t==='theory'?'理论导入':'乐跑导入'}</button>))}</div>
                        
                        <div className="flex-1 overflow-hidden h-full flex flex-col bg-white p-4 rounded shadow">
                            {activeTab === 'standards' && <AdminStandardsPanel sportsList={sportsList} setSportsList={setSportsList} config={config} setConfig={setConfig} />}
                            {activeTab === 'teachers' && (
                                <div className="space-y-4 h-full overflow-auto">
                                    <div className="border-b pb-4"><h3 className="font-semibold mb-2">导入教师</h3><input type="file" accept=".xlsx, .xls" onChange={(e) => handleFileUpload(e, 'teachers')} className="text-sm"/></div>
                                    <div className="grid grid-cols-2 gap-2">{teachers.map(t => (<div key={t.id} className="border p-2 rounded text-sm flex justify-between"><span>{t.name}</span><span className="bg-gray-100 px-1 rounded">{t.id}</span></div>))}</div>
                                </div>
                            )}
                            
                            {activeTab === 'textbook' && <TextbookAdmin />}
                            
                            {(activeTab === 'data' || activeTab === 'run' || activeTab === 'theory') && (
                                <div className="flex flex-col h-full">
                                    <div className="flex justify-between items-center mb-4 gap-2 flex-wrap border-b pb-2">
                                        <div className="flex gap-2 items-center">
                                            <input type="file" accept=".xlsx, .xls" onChange={(e) => handleFileUpload(e, activeTab === 'data' ? 'students' : activeTab)} className="text-xs w-48"/>
                                            <input type="text" placeholder="搜索..." className="border rounded px-2 py-1 text-xs" value={searchTerm} onChange={e => setSearchTerm(e.target.value)}/>
                                        </div>
                                        <div className="flex gap-2">
                                            {activeTab === 'data' && <button onClick={handleClearAllStudents} className="bg-red-600 text-white px-3 py-1 rounded text-xs">清空本学期学生数据</button>}
                                            {activeTab === 'run' && <button onClick={() => handleClearCategory('run')} className="bg-red-500 text-white px-3 py-1 rounded text-xs">清空本学期乐跑</button>}
                                            {activeTab === 'theory' && <button onClick={() => handleClearCategory('theory')} className="bg-red-500 text-white px-3 py-1 rounded text-xs">清空本学期理论</button>}
                                        </div>
                                    </div>
                                    
                                    <AdminTable 
                                        students={paginatedData}
                                        onDelete={handleDeleteRow}
                                        onEdit={(s) => setEditModal({ student: s, mode: activeTab === 'data' ? 'full' : activeTab })}
                                        columns={[
                                            { key: 'id', label: '学号' },
                                            { key: 'name', label: '姓名' },
                                            ...(activeTab === 'data' ? [{ key: 'gender', label: '性别' }, { key: 'adminClass', label: '行政班级' }, { key: 'optionClass', label: '选项' }, { key: 'teacherName', label: '教师' }] : []),
                                            ...(activeTab === 'run' ? [{ key: 'runCount', label: '乐跑次数', render: s => s.scores.runCount }, { key: 'runScore', label: '乐跑成绩', render: s => s.scores.runScore + (s.scores.isRunFailed ? '(不合格)' : '') }] : []),
                                            ...(activeTab === 'theory' ? [{ key: 'theory', label: '理论成绩', render: s => s.scores.theory === '' ? '-' : s.scores.theory }] : [])
                                        ]}
                                    />
                                    
                                    <div className="pt-2 flex justify-between items-center text-xs mt-auto">
                                        <span>共 {filteredStudents.length} 条</span>
                                        <div className="flex gap-1">
                                            <button onClick={()=>setCurrentPageState(p=>Math.max(1, p-1))} disabled={currentPageState===1} className="border px-2 rounded">上一页</button>
                                            <span>{currentPageState}/{totalPages}</span>
                                            <button onClick={()=>setCurrentPageState(p=>Math.min(totalPages, p+1))} disabled={currentPageState===totalPages} className="border px-2 rounded">下一页</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    {editModal && <AdminEditModal student={editModal.student} mode={editModal.mode} onClose={()=>setEditModal(null)} onSave={handleSaveEdit}/>}
                </div>
            );
        };

        // --- 签名上传组件 ---
        const SignatureUpload = ({ teacherName, onClose }) => {
            const [sig, setSig] = useState(null);
            const [loading, setLoading] = useState(true);
            useEffect(() => { (async () => { setLoading(true); const s = await DB.getSignature(teacherName); setSig(s); setLoading(false); })(); }, [teacherName]);
            const handleUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 500 * 1024) { alert('签名图片不能超过500KB'); return; }
                const reader = new FileReader();
                reader.onload = async () => { const b64 = reader.result; setSig(b64); await DB.setSignature(teacherName, b64); alert('签名已保存'); };
                reader.readAsDataURL(file);
            };
            const handleDelete = async () => { if (!confirm('确定删除签名？')) return; setSig(null); await DB.setSignature(teacherName, null); };
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-xl w-full max-w-sm shadow-2xl">
                        <div className="p-4 border-b flex justify-between items-center"><h3 className="font-bold">电子签名管理</h3><button onClick={onClose} className="text-2xl">&times;</button></div>
                        <div className="p-6 text-center">
                            {loading ? <p className="text-gray-400">加载中...</p> : sig ? (
                                <div>
                                    <p className="text-xs text-gray-500 mb-2">当前签名预览：</p>
                                    <img src={sig} alt="签名" className="mx-auto max-h-24 border rounded p-2 bg-gray-50" />
                                    <div className="mt-4 flex gap-2 justify-center">
                                        <label className="bg-blue-600 text-white px-4 py-2 rounded text-sm cursor-pointer hover:bg-blue-700">重新上传<input type="file" accept="image/*" className="hidden" onChange={handleUpload}/></label>
                                        <button onClick={handleDelete} className="bg-red-500 text-white px-4 py-2 rounded text-sm hover:bg-red-600">删除</button>
                                    </div>
                                </div>
                            ) : (
                                <div>
                                    <p className="text-gray-500 mb-4">尚未上传电子签名</p>
                                    <label className="bg-blue-600 text-white px-6 py-2 rounded cursor-pointer hover:bg-blue-700 text-sm">上传签名图片<input type="file" accept="image/*" className="hidden" onChange={handleUpload}/></label>
                                    <p className="text-xs text-gray-400 mt-3">建议：白底手写签名照片，PNG/JPG格式，不超过500KB</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- ExcelJS 导出辅助（支持签名图片） ---
        const exportWithSignature = async (sheetName, columns, rows, fileName, teacherName, swapTeacherName) => {
            const EJ = window.ExcelJS;
            const wb = new EJ.Workbook();
            const ws = wb.addWorksheet(sheetName);

            // 列定义
            ws.columns = columns.map(c => ({ header: c.header, key: c.key, width: c.width || 12 }));

            // 表头样式
            const headerRow = ws.getRow(1);
            headerRow.font = { bold: true };
            headerRow.alignment = { horizontal: 'center', vertical: 'middle' };
            headerRow.eachCell(cell => { cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF5F5DC' } }; cell.border = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} }; });

            // 数据行
            rows.forEach((r, i) => {
                const row = ws.addRow(r);
                row.alignment = { horizontal: 'center', vertical: 'middle' };
                row.eachCell(cell => { cell.border = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} }; });
                // 总评不及格标红
                if (r['总评'] !== undefined && parseFloat(r['总评']) < 60) {
                    const nameCol = columns.findIndex(c => c.key === '姓名') + 1;
                    const totalCol = columns.findIndex(c => c.key === '总评') + 1;
                    if (nameCol > 0) row.getCell(nameCol).font = { color: { argb: 'FFFF0000' }, bold: true };
                    if (totalCol > 0) row.getCell(totalCol).font = { color: { argb: 'FFFF0000' }, bold: true };
                }
            });

            // 签名区域 —— 右下角，标签与签名同一行，标签靠前、图片靠后
            var totalCols = columns.length;
            var sigStartRow = ws.rowCount + 3;
            var labelCol = Math.max(totalCols - 3, 2);  // 标签列（靠前）
            var imgCol = labelCol + 2;                   // 图片列（标签右侧隔一列）

            ws.getRow(sigStartRow).height = 50;
            
            // 任课教师签名
            ws.getCell(sigStartRow, labelCol).value = '任课教师签名：';
            ws.getCell(sigStartRow, labelCol).font = { bold: true };
            ws.getCell(sigStartRow, labelCol).alignment = { horizontal: 'right', vertical: 'middle' };
            var teacherSig = await DB.getSignature(teacherName);
            if (teacherSig) {
                try {
                    var b64 = teacherSig.split(',')[1] || teacherSig;
                    var extT = teacherSig.includes('png') ? 'png' : 'jpeg';
                    var imgId = wb.addImage({ base64: b64, extension: extT });
                    ws.addImage(imgId, { tl: { col: imgCol - 0.8, row: sigStartRow - 1 + 0.1 }, ext: { width: 130, height: 44 } });
                } catch(e) { ws.getCell(sigStartRow, imgCol).value = teacherName; }
            } else {
                ws.getCell(sigStartRow, imgCol).value = teacherName;
            }

            // 换考教师签名（下方隔一行）
            if (swapTeacherName) {
                var swapRow = sigStartRow + 2;
                ws.getRow(swapRow).height = 50;
                ws.getCell(swapRow, labelCol).value = '换考教师签名：';
                ws.getCell(swapRow, labelCol).font = { bold: true };
                ws.getCell(swapRow, labelCol).alignment = { horizontal: 'right', vertical: 'middle' };
                var swapSig = await DB.getSignature(swapTeacherName);
                if (swapSig) {
                    try {
                        var b64s = swapSig.split(',')[1] || swapSig;
                        var extS = swapSig.includes('png') ? 'png' : 'jpeg';
                        var imgIdS = wb.addImage({ base64: b64s, extension: extS });
                        ws.addImage(imgIdS, { tl: { col: imgCol - 0.8, row: swapRow - 1 + 0.1 }, ext: { width: 130, height: 44 } });
                    } catch(e) { ws.getCell(swapRow, imgCol).value = swapTeacherName; }
                } else {
                    ws.getCell(swapRow, imgCol).value = swapTeacherName;
                }
            }

            // 下载
            const buf = await wb.xlsx.writeBuffer();
            const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = fileName; a.click();
            URL.revokeObjectURL(url);
        };

        // --- 换考模块 ---
        const SwapExamModule = ({ currentUser, students, setStudents, semester, sportsList, specialtyConfig, onClose }) => {
            const [swapClaims, setSwapClaims] = useState({});
            const [selectedClass, setSelectedClass] = useState('');
            const [loading, setLoading] = useState(true);

            useEffect(() => { (async () => { setLoading(true); const c = await DB.getSwapClaims(); setSwapClaims(c); setLoading(false); })(); }, []);

            const myClaims = (swapClaims[semester] || {})[currentUser.name] || [];

            // 所有可换考的班级（不是自己教的班级）
            const availableClasses = useMemo(() => {
                const map = {};
                students.filter(s => s.semester === semester).forEach(s => {
                    const cls = s.optionClass;
                    if (!map[cls]) map[cls] = { name: cls, teacher: s.teacherName, count: 0 };
                    map[cls].count++;
                });
                return Object.values(map).filter(c => {
                    const teachers = (c.teacher || '').split(/\s+/);
                    return !teachers.includes(currentUser.name);
                }).sort((a,b) => a.name.localeCompare(b.name, 'zh-CN'));
            }, [students, semester, currentUser.name]);

            const handleClaim = async (cls) => {
                const next = { ...swapClaims };
                if (!next[semester]) next[semester] = {};
                if (!next[semester][currentUser.name]) next[semester][currentUser.name] = [];
                const arr = next[semester][currentUser.name];
                if (arr.includes(cls)) { next[semester][currentUser.name] = arr.filter(c => c !== cls); }
                else { arr.push(cls); }
                setSwapClaims(next);
                await DB.setSwapClaims(next);
            };

            const classStudents = useMemo(() => {
                if (!selectedClass) return [];
                return students.filter(s => s.semester === semester && s.optionClass === selectedClass).sort((a,b) => parseInt(a.id) - parseInt(b.id));
            }, [students, semester, selectedClass]);

            const matchedSport = useMemo(() => { return sportsList.find(s => selectedClass?.includes(s)) || sportsList[0]; }, [selectedClass, sportsList]);
            const config = specialtyConfig[matchedSport] || { spec1: {type:'score'}, spec2: {type:'score'} };

            const handleSaveSpec = (sid, field, val) => {
                setStudents(prev => prev.map(s => {
                    if (s.id === sid && s.semester === semester) {
                        const newScores = { ...s.scores, [field]: val, swapTeacher: currentUser.name };
                        // 如果是原始值输入，计算折算分
                        if (field === 'rawSpec1' || field === 'rawSpec2') {
                            const specConf = field === 'rawSpec1' ? config.spec1 : config.spec2;
                            const scoreField = field === 'rawSpec1' ? 'special1' : 'special2';
                            newScores[scoreField] = calculateSpecialtyScore(val, s.gender, specConf);
                        }
                        return { ...s, scores: newScores };
                    }
                    return s;
                }));
            };

            if (loading) return <div className="fixed inset-0 bg-white z-[50] flex items-center justify-center"><p>加载中...</p></div>;

            // 如果选择了班级，显示打分界面
            if (selectedClass) {
                return (
                    <div className="fixed inset-0 bg-white z-[50] flex flex-col">
                        <div className="p-4 shadow flex justify-between items-center bg-green-50">
                            <div><h3 className="font-bold text-green-800">换考打分：{selectedClass}</h3><p className="text-xs text-gray-500">仅可录入专项1和专项2 · 自动保存</p></div>
                            <button onClick={() => setSelectedClass('')} className="text-gray-500 text-2xl">&times;</button>
                        </div>
                        <div className="flex-1 overflow-auto p-2">
                            <table className="min-w-full text-xs border-collapse">
                                <thead><tr className="bg-gray-100">
                                    <th className="border p-2 sticky left-0 bg-gray-100 z-10">姓名</th>
                                    <th className="border p-2">学号</th>
                                    <th className="border p-2">性别</th>
                                    <th className="border p-2 bg-orange-50">专项1 ({config.spec1?.type === 'score' ? '分值' : config.spec1?.type})</th>
                                    <th className="border p-2 bg-orange-50">专项2 ({config.spec2?.type === 'score' ? '分值' : config.spec2?.type})</th>
                                </tr></thead>
                                <tbody>
                                    {classStudents.map(s => (
                                        <tr key={s.id} className="hover:bg-gray-50">
                                            <td className="border p-1 font-medium sticky left-0 bg-white z-10">{s.name}</td>
                                            <td className="border p-1 text-gray-500">{s.id}</td>
                                            <td className="border p-1 text-center">{s.gender}</td>
                                            <td className="border p-1 bg-orange-50">
                                                <input type="number" className="w-full text-center p-1 border-0 outline-none focus:bg-orange-100 rounded"
                                                    value={config.spec1?.type === 'score' ? (s.scores.special1 || '') : (s.scores.rawSpec1 || '')}
                                                    onChange={e => handleSaveSpec(s.id, config.spec1?.type === 'score' ? 'special1' : 'rawSpec1', e.target.value)} />
                                                {config.spec1?.type !== 'score' && s.scores.special1 ? <div className="text-xs text-orange-600 text-center">→{s.scores.special1}分</div> : null}
                                            </td>
                                            <td className="border p-1 bg-orange-50">
                                                <input type="number" className="w-full text-center p-1 border-0 outline-none focus:bg-orange-100 rounded"
                                                    value={config.spec2?.type === 'score' ? (s.scores.special2 || '') : (s.scores.rawSpec2 || '')}
                                                    onChange={e => handleSaveSpec(s.id, config.spec2?.type === 'score' ? 'special2' : 'rawSpec2', e.target.value)} />
                                                {config.spec2?.type !== 'score' && s.scores.special2 ? <div className="text-xs text-orange-600 text-center">→{s.scores.special2}分</div> : null}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            }

            // 班级列表
            return (
                <div className="fixed inset-0 bg-white z-[50] flex flex-col">
                    <div className="p-4 shadow flex justify-between items-center bg-green-50">
                        <div><h3 className="font-bold text-green-800">换考模块</h3><p className="text-xs text-gray-500">认领班级后可为学生打专项分</p></div>
                        <button onClick={onClose} className="text-gray-500 text-2xl">&times;</button>
                    </div>
                    <div className="flex-1 overflow-auto p-4">
                        {myClaims.length > 0 && (
                            <div className="mb-6">
                                <h4 className="font-bold text-sm text-green-700 mb-2">已认领的换考班级 (点击进入打分)</h4>
                                <div className="flex flex-wrap gap-2">
                                    {myClaims.map(cls => (
                                        <button key={cls} onClick={() => setSelectedClass(cls)} className="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700">{cls}</button>
                                    ))}
                                </div>
                            </div>
                        )}
                        <h4 className="font-bold text-sm text-gray-600 mb-2">可认领的班级</h4>
                        <div className="space-y-2">
                            {availableClasses.map(c => {
                                const claimed = myClaims.includes(c.name);
                                return (
                                    <div key={c.name} className="flex justify-between items-center bg-white border rounded-lg p-3">
                                        <div><span className="font-bold">{c.name}</span><span className="text-xs text-gray-500 ml-2">学生: {c.count} | 原分配: <span className={c.teacher ? 'text-green-600' : 'text-red-500'}>{c.teacher || '未分配'}</span></span></div>
                                        <button onClick={() => handleClaim(c.name)} className={`px-3 py-1 rounded text-sm ${claimed ? 'bg-gray-200 text-gray-600' : 'bg-green-600 text-white hover:bg-green-700'}`}>{claimed ? '取消认领' : '认领'}</button>
                                    </div>
                                );
                            })}
                            {availableClasses.length === 0 && <p className="text-gray-400 text-center py-6">没有可认领的班级</p>}
                        </div>
                    </div>
                </div>
            );
        };

        const TeacherPanel = ({ currentUser, students, setStudents, semester, setSemester, onLogout, sportsList, specialtyConfig }) => {
            const [selectedClass, setSelectedClass] = useState('');
            const [viewMode, setViewMode] = useState('card'); 
            const [editingStudent, setEditingStudent] = useState(null);
            const [showClaimModal, setShowClaimModal] = useState(false);
            const [toastMsg, setToastMsg] = useState('');
            const [batchField, setBatchField] = useState('regular1');
            const [docView, setDocView] = useState(null);
            const [showSigModal, setShowSigModal] = useState(false);
            const [showSwapExam, setShowSwapExam] = useState(false);
            const semesterOptions = getSemesterOptions();
            const semType = getSemesterType(semester);

            const myStudents = useMemo(() => students.filter(s => {
                if (s.semester !== semester) return false;
                const teachers = (s.teacherName || '').split(/\s+/);
                return teachers.includes(currentUser.name);
            }), [students, currentUser.name, semester]);
            
            const myClasses = useMemo(() => [...new Set(myStudents.map(s => s.optionClass))].sort(), [myStudents]);
            const classStudents = useMemo(() => {
                if(!selectedClass) return [];
                return myStudents.filter(s => s.optionClass === selectedClass).sort((a,b)=>parseInt(a.id)-parseInt(b.id));
            }, [myStudents, selectedClass]);
            
            const matchedSport = useMemo(() => {
                if (!selectedClass) return sportsList[0];
                return sportsList.find(s => selectedClass.includes(s)) || sportsList[0];
            }, [selectedClass, sportsList]);
            const config = specialtyConfig[matchedSport] || { spec1: {type:'score'}, spec2: {type:'score'} };

            const allClassesForClaim = useMemo(() => {
                const map = {};
                const currentSemStudents = students.filter(s => s.semester === semester);
                currentSemStudents.forEach(s => {
                    const clsName = s.optionClass;
                    if (!map[clsName]) map[clsName] = { name: clsName, teacher: s.teacherName, count: 0 };
                    map[clsName].count++;
                    if(s.teacherName && !map[clsName].teacher) map[clsName].teacher = s.teacherName;
                });
                return Object.values(map).sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
            }, [students, semester]);

            const handleClaimClass = (className) => {
                const teacherName = currentUser.name;
                setStudents(prev => prev.map(s => {
                    if (s.semester === semester && s.optionClass === className) {
                        let names = (s.teacherName || '').split(/\s+/).filter(n => n);
                        if (!names.includes(teacherName)) {
                            names.push(teacherName); 
                        } else {
                            names = names.filter(n => n !== teacherName); 
                        }
                        return { ...s, teacherName: names.join(' ') };
                    }
                    return s;
                }));
                setToastMsg(`操作成功: "${className}"`);
            };

            const handleBatchUpdate = (updates) => {
                setStudents(prev => {
                    const newStudents = [...prev];
                    updates.forEach(u => {
                        const idx = newStudents.findIndex(s => s.id === u.id && s.semester === semester);
                        if(idx >= 0) newStudents[idx] = { ...newStudents[idx], ...u };
                    });
                    return newStudents;
                });
            };

            const handleSaveOne = (sid, scores) => {
                setStudents(prev => prev.map(s => (s.id === sid && s.semester === semester) ? { ...s, scores } : s));
            };

            const handleBatchSaveScore = useCallback((studentId, updates) => {
                setStudents(prev => prev.map(s => {
                    if (s.id === studentId && s.semester === semester) {
                        return { ...s, scores: { ...s.scores, ...updates } };
                    }
                    return s;
                }));
            }, [semester]); 

            // 获取换考教师名
            const swapTeacherOfClass = useMemo(() => {
                const names = classStudents.map(s => s.scores.swapTeacher).filter(Boolean);
                return [...new Set(names)][0] || '';
            }, [classStudents]);

            const handleExportComprehensive = async () => {
                if (!selectedClass) return;
                const defaultName = `${semester}-成绩表（综合平台）-${selectedClass}-${currentUser.name}`;
                const fileName = prompt('导出文件名：', defaultName);
                if (!fileName) return;

                const cols = [
                    { header: '序号', key: '序号', width: 6 }, { header: '行政班级', key: '行政班级', width: 14 },
                    { header: '学号', key: '学号', width: 14 }, { header: '姓名', key: '姓名', width: 10 },
                    { header: '性别', key: '性别', width: 6 }, { header: '平时1', key: '平时1', width: 8 },
                    { header: '平时2', key: '平时2', width: 8 }, { header: '专项', key: '专项', width: 8 },
                    { header: '统考', key: '统考', width: 8 }, { header: '晨跑(次数)', key: '晨跑(次数)', width: 10 },
                    { header: '晨跑(成绩)', key: '晨跑(成绩)', width: 10 },
                ];
                if (semType === 'spring') cols.push({ header: '理论', key: '理论', width: 8 });
                cols.push({ header: '总评', key: '总评', width: 8 });

                const rows = classStudents.map((s, i) => {
                    const row = {
                        '序号': i + 1, '行政班级': s.adminClass, '学号': s.id, '姓名': s.name, '性别': s.gender,
                        '平时1': s.scores.regular1 || '', '平时2': s.scores.regular2 || '',
                        '专项': ((parseFloat(s.scores.special1||0) + parseFloat(s.scores.special2||0))/2).toFixed(1),
                        '统考': (((calculateStdTestScore(s.scores.rawItem1, getTestItemsName(semType, s.gender).item1, s.gender) || 0) + (calculateStdTestScore(s.scores.rawItem2, getTestItemsName(semType, s.gender).item2, s.gender) || 0)) / 2).toFixed(1),
                        '晨跑(次数)': s.scores.runCount || '', '晨跑(成绩)': s.scores.runScore || '',
                    };
                    if (semType === 'spring') row['理论'] = s.scores.theory || '';
                    row['总评'] = calculateFinalScore(s.scores, semType);
                    return row;
                });
                await exportWithSignature('成绩表（综合平台）', cols, rows, fileName + '.xlsx', currentUser.name, swapTeacherOfClass);
            };

            const handleExportDetailed = async () => {
                if (!selectedClass) return;
                const defaultName = `${semester}-成绩表（每项成绩）-${selectedClass}-${currentUser.name}`;
                const fileName = prompt('导出文件名：', defaultName);
                if (!fileName) return;

                const testNames = getTestItemsName(semType, '男');
                const cols = [
                    { header: '序号', key: '序号', width: 6 }, { header: '行政班级', key: '行政班级', width: 14 },
                    { header: '学号', key: '学号', width: 14 }, { header: '姓名', key: '姓名', width: 10 },
                    { header: '性别', key: '性别', width: 6 }, { header: '平时1', key: '平时1', width: 8 },
                    { header: '平时2', key: '平时2', width: 8 },
                    { header: '专项1', key: '专项1', width: 8 }, { header: '专项2', key: '专项2', width: 8 },
                    { header: `${testNames.display1}(原始)`, key: '统考1原始', width: 14 },
                    { header: `${testNames.display1}(折算)`, key: '统考1折算', width: 14 },
                    { header: `${testNames.display2}(原始)`, key: '统考2原始', width: 12 },
                    { header: `${testNames.display2}(折算)`, key: '统考2折算', width: 12 },
                    { header: '乐跑次数', key: '乐跑次数', width: 10 }, { header: '乐跑分数', key: '乐跑分数', width: 10 },
                ];
                if (semType === 'spring') cols.push({ header: '理论', key: '理论', width: 8 });

                const rows = classStudents.map((s, i) => {
                    const tn = getTestItemsName(semType, s.gender);
                    const raw1 = s.scores.rawItem1 || '';
                    const raw2 = s.scores.rawItem2 || '';
                    const score1 = calculateStdTestScore(raw1, tn.item1, s.gender);
                    const score2 = calculateStdTestScore(raw2, tn.item2, s.gender);
                    const row = {
                        '序号': i + 1, '行政班级': s.adminClass, '学号': s.id, '姓名': s.name, '性别': s.gender,
                        '平时1': s.scores.regular1 || '', '平时2': s.scores.regular2 || '',
                        '专项1': s.scores.special1 || '', '专项2': s.scores.special2 || '',
                        '统考1原始': raw1, '统考1折算': score1 !== null ? score1 : '',
                        '统考2原始': raw2, '统考2折算': score2 !== null ? score2 : '',
                        '乐跑次数': s.scores.runCount || '', '乐跑分数': s.scores.runScore || '',
                    };
                    if (semType === 'spring') row['理论'] = s.scores.theory || '';
                    return row;
                });
                await exportWithSignature('成绩表（每项成绩）', cols, rows, fileName + '.xlsx', currentUser.name, swapTeacherOfClass);
            };

            const [showExportMenu, setShowExportMenu] = useState(false);

            const batchOptions = [
                { key: 'regular1', label: '平时分1' }, { key: 'regular2', label: '平时分2' },
                { key: 'special1', label: '专项分1' }, { key: 'special2', label: '专项分2' },
                { key: 'runCount', label: '乐跑次数' }, { key: 'runScore', label: '乐跑得分' },
                { key: 'stdItem1', label: '统考项目1' }, { key: 'stdItem2', label: '统考项目2' },
            ];
            if (semType === 'spring') batchOptions.push({ key: 'theory', label: '理论成绩' });

            if (docView) {
                return (
                    <div className="min-h-screen bg-gray-50 pb-20 flex flex-col">
                         <header className="bg-white shadow z-10 p-3 flex justify-between items-center">
                            <h1 className="font-bold">{docView === 'textbook' ? '教材' : '文档管理'}</h1>
                             <button onClick={() => setDocView(null)} className="text-sm text-gray-500">关闭</button>
                        </header>
                         <div className="flex-1 overflow-hidden p-4">
                             {docView === 'textbook' 
                                ? <TextbookViewer onBack={() => setDocView(null)} />
                                : <DocumentManager category={docView} teacherName={currentUser.name} onBack={() => setDocView(null)} />
                             }
                         </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20 flex flex-col">
                    <header className="bg-white shadow z-10">
                        <div className="p-3 flex justify-between items-center">
                            <h1 className="font-bold">{currentUser.name}老师</h1>
                            <div className="flex items-center gap-2">
                                <select value={semester} onChange={(e) => setSemester(e.target.value)} className="text-xs text-gray-500 border rounded p-1 bg-gray-50">{semesterOptions.map(opt => (<option key={opt} value={opt}>{opt}</option>))}</select>
                                <button onClick={onLogout} className="text-sm text-gray-500">退出</button>
                            </div>
                        </div>
                        <div className="px-3 pb-2 flex gap-2 overflow-x-auto hide-scrollbar border-b border-gray-100">
                             <button onClick={() => setDocView('textbook')} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 text-xs font-bold whitespace-nowrap border border-amber-200">教材</button>
                             <button onClick={() => setDocView('syllabus')} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-indigo-50 text-indigo-600 text-xs font-bold whitespace-nowrap">教学大纲</button>
                             <button onClick={() => setDocView('schedule')} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-purple-50 text-purple-600 text-xs font-bold whitespace-nowrap">教学进度表</button>
                             <button onClick={() => setDocView('plan')} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-teal-50 text-teal-600 text-xs font-bold whitespace-nowrap">教案</button>
                             <button onClick={() => setShowSigModal(true)} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-pink-50 text-pink-600 text-xs font-bold whitespace-nowrap border border-pink-200">✍ 签名</button>
                             <button onClick={() => setShowSwapExam(true)} className="flex items-center gap-1 px-3 py-1.5 rounded-full bg-green-50 text-green-700 text-xs font-bold whitespace-nowrap border border-green-200">🔄 换考</button>
                        </div>
                        <div className="px-3 py-2 bg-gray-50 flex items-center scrolling-wrapper gap-2">
                            <button onClick={() => setShowClaimModal(true)} className="flex-shrink-0 mr-3 px-3 py-1.5 rounded-full text-sm border border-dashed border-blue-400 text-blue-600 bg-blue-50 flex items-center gap-1 hover:bg-blue-100 whitespace-nowrap">认领班级</button>
                            {myClasses.map(c => (<button key={c} onClick={()=>{setSelectedClass(c); setViewMode('card');}} className={`flex-shrink-0 mr-2 px-3 py-1 rounded text-sm ${selectedClass===c?'bg-blue-600 text-white':'bg-white border'}`}>{c}</button>))}
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden relative">
                        {!selectedClass ? (
                            <div className="p-10 text-center text-gray-400">请选择班级 (或点击上方"认领班级"添加)</div>
                        ) : (
                            <>
                                <div className="p-2 bg-white border-b flex gap-2 overflow-x-auto">
                                    <button onClick={()=>setViewMode('card')} className={`px-3 py-1 text-xs rounded border ${viewMode==='card'?'bg-blue-50 border-blue-500 text-blue-700':''}`}>成绩录入</button>
                                    <button onClick={()=>setViewMode('std')} className={`px-3 py-1 text-xs rounded border ${viewMode==='std'?'bg-blue-50 border-blue-500 text-blue-700':''}`}>统考记录</button>
                                    <button onClick={()=>setViewMode('mock')} className={`px-3 py-1 text-xs rounded border ${viewMode==='mock'?'bg-blue-50 border-blue-500 text-blue-700':''}`}>模拟测试及作业</button>
                                    <button onClick={()=>setViewMode('attendance')} className={`px-3 py-1 text-xs rounded border ${viewMode==='attendance'?'bg-blue-50 border-blue-500 text-blue-700':''}`}>考勤管理</button>
                                </div>

                                <div className="h-full overflow-y-auto p-2 pb-24">
                                    {viewMode === 'card' && (
                                        <>
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                                                <span className="text-sm text-gray-500">班级人数: {classStudents.length}</span>
                                                <div className="flex gap-2">
                                                    <div className="flex bg-white rounded-lg shadow-sm border p-1">
                                                        <button onClick={() => setViewMode('card')} className={`px-3 py-1 text-xs rounded bg-blue-100 text-blue-700 font-bold`}>卡片模式</button>
                                                        <button onClick={() => setViewMode('batch')} className={`px-3 py-1 text-xs rounded text-gray-500`}>按项目录入</button>
                                                    </div>
                                                    <div className="relative">
                                                        <button onClick={() => setShowExportMenu(!showExportMenu)} className="flex items-center gap-1 bg-green-600 text-white px-3 py-1.5 rounded text-sm hover:bg-green-700"><Icon name="download" size={14}/> 导出 ▾</button>
                                                        {showExportMenu && (
                                                            <div className="absolute right-0 top-full mt-1 bg-white border rounded-lg shadow-lg z-50 w-48">
                                                                <button onClick={() => { setShowExportMenu(false); handleExportComprehensive(); }} className="w-full text-left px-3 py-2 text-sm hover:bg-gray-100 rounded-t-lg">成绩表（综合平台）</button>
                                                                <button onClick={() => { setShowExportMenu(false); handleExportDetailed(); }} className="w-full text-left px-3 py-2 text-sm hover:bg-gray-100 rounded-b-lg border-t">成绩表（每项成绩）</button>
                                                            </div>
                                                        )}
                                                </div>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                {classStudents.map(s => {
                                                    const final = calculateFinalScore(s.scores, semType);
                                                    const isFail = parseFloat(final) < 60;
                                                    return (
                                                        <div key={s.id} onClick={()=>setEditingStudent(s)} className="bg-white p-4 rounded shadow-sm border border-gray-100 active:scale-95 transition-transform">
                                                            <div className="flex justify-between items-start">
                                                                <div><h3 className="font-bold">{s.name}</h3><p className="text-xs text-gray-500">{s.id}</p></div>
                                                                <div className="text-right">
                                                                    <div className={`font-bold text-lg ${isFail ? 'text-red-600' : 'text-blue-600'}`}>{final}</div>
                                                                    {s.scores.isRunFailed && <span className="text-xs text-red-500 block">乐跑不合格</span>}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </>
                                    )}

                                    {viewMode === 'batch' && (
                                        <>
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
                                                <span className="text-sm text-gray-500">班级人数: {classStudents.length}</span>
                                                <div className="flex gap-2">
                                                    <div className="flex bg-white rounded-lg shadow-sm border p-1">
                                                        <button onClick={() => setViewMode('card')} className={`px-3 py-1 text-xs rounded text-gray-500`}>卡片模式</button>
                                                        <button onClick={() => setViewMode('batch')} className={`px-3 py-1 text-xs rounded bg-blue-100 text-blue-700 font-bold`}>按项目录入</button>
                                                    </div>
                                                    <select value={batchField} onChange={(e) => setBatchField(e.target.value)} className="border border-blue-300 rounded px-2 py-1 text-sm focus:ring-2 ring-blue-500 outline-none">
                                                        {batchOptions.map(opt => <option key={opt.key} value={opt.key}>{opt.label}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <BatchEntryTable students={classStudents} field={batchField} fieldName={batchOptions.find(o => o.key === batchField)?.label} semester={semester} config={config} onBatchSave={handleBatchSaveScore} />
                                        </>
                                    )}

                                    {viewMode === 'std' && (
                                        <div className="h-full">
                                            <StdTestModule students={classStudents} semester={semester} className={selectedClass} teacherName={currentUser.name} onSave={handleBatchUpdate} onClose={()=>setViewMode('card')} />
                                        </div>
                                    )}

                                    {viewMode === 'attendance' && (
                                        <div className="h-full">
                                            <AttendanceModule students={classStudents} semester={semester} className={selectedClass} teacherName={currentUser.name} onSave={handleBatchUpdate} onClose={()=>setViewMode('card')} />
                                        </div>
                                    )}

                                    {viewMode === 'mock' && (
                                        <div className="h-full">
                                            <MockTestModule students={classStudents} semester={semester} className={selectedClass} teacherName={currentUser.name} onSave={handleBatchUpdate} onClose={()=>setViewMode('card')} />
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </main>

                    {/* 认领弹窗 */}
                    {showClaimModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-xl w-full max-w-lg shadow-2xl flex flex-col max-h-[80vh] relative z-[101]">
                                <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                                    <h3 className="text-lg font-bold">认领/添加班级</h3>
                                    <button onClick={() => setShowClaimModal(false)} className="text-2xl">&times;</button>
                                </div>
                                <div className="p-4 overflow-y-auto">
                                    <p className="text-sm text-gray-500 mb-4">点击“添加”将班级加入您的列表。再次点击可取消。</p>
                                    <div className="space-y-2">
                                        {allClassesForClaim.map(cls => {
                                            // Check using string splitting
                                            const teacherNames = (cls.teacher || '').split(/\s+/);
                                            const isClaimed = teacherNames.includes(currentUser.name);
                                            return (
                                                <div key={cls.name} className="flex justify-between items-center p-3 border rounded hover:bg-gray-50">
                                                    <div>
                                                        <div className="font-bold text-gray-800">{cls.name}</div>
                                                        <div className="text-xs text-gray-500">
                                                            学生: {cls.count} | 
                                                            原分配: {cls.teacher ? <span className="text-green-600">{cls.teacher}</span> : <span className="text-red-500">未分配</span>}
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={() => handleClaimClass(cls.name)}
                                                        className={`text-xs px-3 py-1.5 rounded text-white ${isClaimed ? 'bg-gray-400 hover:bg-gray-500' : 'bg-blue-600 hover:bg-blue-700'}`}
                                                    >
                                                        {isClaimed ? '取消认领' : '添加'}
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editingStudent && (
                        <GradingModal 
                            student={editingStudent} 
                            semester={semester} 
                            onClose={()=>setEditingStudent(null)} 
                            onSave={handleSaveOne}
                            sportsList={sportsList}
                            specialtyConfig={specialtyConfig}
                        />
                    )}
                    
                    {toastMsg && <Toast msg={toastMsg} onClose={() => setToastMsg('')} />}
                    {showSigModal && <SignatureUpload teacherName={currentUser.name} onClose={() => setShowSigModal(false)} />}
                    {showSwapExam && <SwapExamModule currentUser={currentUser} students={students} setStudents={setStudents} semester={semester} sportsList={sportsList} specialtyConfig={specialtyConfig} onClose={() => setShowSwapExam(false)} />}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [students, setStudents] = useState([]);
            const [teachers, setTeachers] = useState(INITIAL_TEACHERS);
            const [sportsList, setSportsList] = useState(DEFAULT_SPORTS_LIST);
            const [specialtyConfig, setConfig] = useState(DEFAULT_SPECIALTY_CONFIG);
            const [semester, setSemester] = useState(getDefaultSemester());
            const [adminPassword, setAdminPassword] = useState('admin888');
            const [saveStatus, setSaveStatus] = useState(''); // '', 'saving', 'saved', 'error'
            const dataReadyRef = React.useRef(false); // 数据初始化完成标志
            const initialLoadCountRef = React.useRef(0); // 初次加载学生数量（用于安全校验）

            // --- 初始化：从 Supabase 加载所有数据 ---
            useEffect(() => {
                (async () => {
                    setLoading(true);
                    try {
                        const [dbTeachers, dbStudents, dbSportsList, dbSpecConfig, dbAdminPwd] = await Promise.all([
                            DB.getTeachers(),
                            DB.getStudents(),
                            DB.getConfig('sports_list', DEFAULT_SPORTS_LIST),
                            DB.getConfig('specialty_config', DEFAULT_SPECIALTY_CONFIG),
                            DB.getConfig('admin_password', 'admin888'),
                        ]);
                        if (dbTeachers && dbTeachers.length > 0) setTeachers(dbTeachers);
                        if (dbStudents === null) {
                            // DB 连接失败（区别于"确实没有数据"）
                            console.error('Supabase 返回 null，可能连接失败或项目已暂停');
                            alert('⚠️ 数据库连接异常，数据可能未完整加载。\n请检查Supabase项目是否已暂停（免费版7天不活跃会暂停）。\n\n本次打开为只读模式，不会覆盖云端数据。');
                            // 不设置 dataReadyRef = true，防止空数据覆盖
                            setLoading(false);
                            return;
                        }
                        setStudents(dbStudents);
                        initialLoadCountRef.current = dbStudents.length;
                        // 本地备份（用于灾难恢复）
                        if (dbStudents.length > 0) {
                            try { localStorage.setItem('pe_students_backup', JSON.stringify(dbStudents)); } catch(e) {}
                        }
                        if (dbSportsList) setSportsList(dbSportsList);
                        if (dbSpecConfig) setConfig(dbSpecConfig);
                        if (dbAdminPwd) setAdminPassword(dbAdminPwd);
                        setTimeout(() => { dataReadyRef.current = true; }, 500);
                    } catch (err) {
                        console.error('初始化加载失败:', err);
                        // 尝试本地备份恢复
                        try {
                            const backup = JSON.parse(localStorage.getItem('pe_students_backup'));
                            if (backup && backup.length > 0) {
                                setStudents(backup);
                                initialLoadCountRef.current = backup.length;
                                alert('⚠️ 云端连接失败，已加载本地备份数据（' + backup.length + '条）。\n修改将在网络恢复后自动同步。');
                                setTimeout(() => { dataReadyRef.current = true; }, 500);
                            } else {
                                alert('⚠️ 云端连接失败且无本地备份。请检查网络后刷新。');
                            }
                        } catch(e) {
                            alert('⚠️ 云端连接失败。请检查网络后刷新。');
                        }
                    }
                    setLoading(false);
                })();
            }, []);

            // --- 学生数据变化时自动同步到 Supabase ---
            const saveTimerRef = React.useRef(null);
            const saveRetryCount = React.useRef(0);
            const [saveError, setSaveError] = useState('');
            useEffect(() => {
                // 数据未就绪前，不触发任何保存
                if (!dataReadyRef.current) return;
                // 安全校验：如果当前学生数远少于初始加载数，阻止保存并警告
                if (initialLoadCountRef.current > 10 && students.length < initialLoadCountRef.current * 0.5) {
                    console.error('安全拦截：当前数据(' + students.length + ')远少于初始加载(' + initialLoadCountRef.current + ')，跳过保存');
                    setSaveStatus('error');
                    setSaveError('数据异常减少，已阻止保存以防数据丢失。请刷新页面。');
                    return;
                }
                if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
                setSaveStatus('saving');
                saveTimerRef.current = setTimeout(async () => {
                    try {
                        // 保存前先更新本地备份
                        if (students.length > 0) {
                            try { localStorage.setItem('pe_students_backup', JSON.stringify(students)); } catch(e) {}
                        }
                        await DB.saveStudents(students);
                        setSaveStatus('saved');
                        saveRetryCount.current = 0;
                        setSaveError('');
                        setTimeout(() => setSaveStatus(''), 2000);
                    } catch (err) {
                        console.error('保存失败:', err);
                        setSaveError(err.message || '未知错误');
                        setSaveStatus('error');
                        if (saveRetryCount.current < 1) {
                            saveRetryCount.current++;
                            setTimeout(async () => {
                                try {
                                    setSaveStatus('saving');
                                    await DB.saveStudents(students);
                                    setSaveStatus('saved');
                                    setSaveError('');
                                    setTimeout(() => setSaveStatus(''), 2000);
                                } catch(e) {
                                    setSaveStatus('error');
                                    setSaveError(e.message || '重试失败');
                                }
                            }, 3000);
                        }
                    }
                }, 1500);
                return () => clearTimeout(saveTimerRef.current);
            }, [students]);

            // --- 教师数据同步 ---
            useEffect(() => {
                if (!dataReadyRef.current) return;
                DB.setTeachers(teachers);
            }, [teachers]);

            // --- 配置数据同步 ---
            useEffect(() => {
                if (!dataReadyRef.current) return;
                DB.setConfig('sports_list', sportsList);
            }, [sportsList]);

            useEffect(() => {
                if (!dataReadyRef.current) return;
                DB.setConfig('specialty_config', specialtyConfig);
            }, [specialtyConfig]);

            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, []);

            if (loading) return (
                <div className="loading-overlay">
                    <div className="spinner"></div>
                    <p className="mt-4 text-gray-500 text-sm">正在连接云端数据...</p>
                </div>
            );

            if (!user) return <LoginPage onLogin={setUser} users={teachers} adminPassword={adminPassword} />;

            const SaveIndicator = () => {
                if (!saveStatus) return null;
                const styles = { saving: 'bg-yellow-100 text-yellow-700', saved: 'bg-green-100 text-green-700', error: 'bg-red-100 text-red-700' };
                const labels = { saving: '☁️ 正在同步...', saved: '✅ 已同步到云端', error: '❌ 同步失败' };
                return <div onClick={() => { if(saveError) alert('同步错误详情:\n' + saveError); }} className={`fixed bottom-4 right-4 px-3 py-1.5 rounded-full text-xs z-[200] shadow cursor-pointer ${styles[saveStatus]}`}>{labels[saveStatus]}{saveStatus === 'error' && ' (点击查看)'}</div>;
            };

            return (
                <>
                    <SaveIndicator />
                    {user.role === 'admin' 
                        ? <AdminPanel 
                            students={students} setStudents={setStudents} 
                            semester={semester} setSemester={setSemester} 
                            onLogout={() => setUser(null)}
                            sportsList={sportsList} setSportsList={setSportsList}
                            config={specialtyConfig} setConfig={setConfig}
                            teachers={teachers} setTeachers={setTeachers}
                          />
                        : <TeacherPanel 
                            currentUser={user} 
                            students={students} setStudents={setStudents}
                            semester={semester} setSemester={setSemester}
                            onLogout={() => setUser(null)}
                            sportsList={sportsList}
                            specialtyConfig={specialtyConfig}
                          />
                    }
                </>
            );
        };

        // --- ErrorBoundary: 防止白屏，显示具体错误 ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, info) { console.error('ErrorBoundary caught:', error, info); }
            render() {
                if (this.state.hasError) {
                    return React.createElement('div', { style: { padding: '40px', textAlign: 'center' } },
                        React.createElement('h2', { style: { color: '#ef4444', marginBottom: '16px' } }, '⚠️ 页面出现错误'),
                        React.createElement('pre', { style: { background: '#f3f4f6', padding: '16px', borderRadius: '8px', textAlign: 'left', overflow: 'auto', fontSize: '12px', maxHeight: '300px' } }, String(this.state.error)),
                        React.createElement('button', { onClick: () => { this.setState({ hasError: false, error: null }); }, style: { marginTop: '16px', padding: '8px 24px', background: '#3b82f6', color: 'white', borderRadius: '8px', border: 'none', cursor: 'pointer' } }, '重试'),
                        React.createElement('p', { style: { marginTop: '12px', color: '#6b7280', fontSize: '13px' } }, '请截图此页面并发送给开发者')
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);

    </script>
</body>
</html>
