<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 优化移动端视口：禁止缩放，模拟原生 App 体验 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA 配置：全屏显示，设置主题色 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    <meta name="format-detection" content="telephone=no">
    
    <!-- 内置 Manifest，支持添加到主屏幕 -->
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%E9%AB%98%E6%A0%A1%E4%BD%93%E8%82%B2%E8%AF%BE%E6%88%90%E7%BB%A9%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F%22%2C%22short_name%22%3A%22%E4%BD%93%E8%82%B2%E8%AF%84%E5%88%86%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22theme_color%22%3A%22%232563eb%22%2C%22background_color%22%3A%22%23f3f4f6%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fimg.icons8.com%2Ffluency%2F96%2Frunning.png%22%2C%22sizes%22%3A%2296x96%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D' />
    <!-- 图标支持 (使用在线图标作为示例) -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/96/running.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/96/running.png">

    <title>高校体育课成绩管理系统</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS for Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .touch-target { min-height: 44px; min-width: 44px; }
        /* 表格输入框获得焦点时的样式 */
        .input-cell:focus { outline: 2px solid #3b82f6; background-color: #eff6ff; }
        /* 移动端输入框字体优化，防止 iOS 自动放大 */
        input, select, textarea { font-size: 16px !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- 1. 配置与标准数据 ---

        // 清空默认学生数据
        const INITIAL_STUDENTS = [];

        const INITIAL_TEACHERS = [
            { name: "张老师", id: "T001" },
            { name: "王老师", id: "T002" }
        ];

        // 评分标准表
        const SCORING_STANDARDS = {
            // 长跑使用 mm.ss 格式，需转换为秒
            '1200m跑': { type: 'long_run', gender: '女', table: [[5.14, 100], [5.40, 90], [6.07, 80], [6.33, 70], [7.00, 60], [7.15, 50], [7.30, 40], [8.30, 0]] },
            '1500m跑': { type: 'long_run', gender: '男', table: [[5.14, 100], [5.40, 90], [6.07, 80], [6.33, 70], [7.00, 60], [7.18, 50], [7.35, 40], [8.46, 0]] },
            // 立定跳远 (米)
            '立定跳远_男': { type: 'high_better', gender: '男', table: [[2.73, 100], [2.57, 90], [2.41, 80], [2.26, 70], [2.10, 60], [2.05, 50], [2.00, 40], [1.80, 0]] },
            '立定跳远_女': { type: 'high_better', gender: '女', table: [[2.07, 100], [1.95, 90], [1.83, 80], [1.72, 70], [1.60, 60], [1.54, 50], [1.49, 40], [1.25, 0]] },
            // 短跑 (秒)
            '100m跑_男': { type: 'low_better', gender: '男', table: [[13.40, 100], [14.00, 90], [14.60, 80], [15.20, 70], [15.80, 60], [16.40, 50], [17.00, 40], [19.40, 0]] },
            '100m跑_女': { type: 'low_better', gender: '女', table: [[16.40, 100], [17.00, 90], [17.60, 80], [18.20, 70], [18.80, 60], [19.40, 50], [20.00, 40], [22.40, 0]] },
            // 力量 (个)
            '俯卧撑': { type: 'high_better', gender: '男', table: [[40, 100], [35, 90], [30, 80], [25, 70], [20, 60], [15, 50], [10, 40], [0, 0]] },
            '仰卧起坐': { type: 'high_better', gender: '女', table: [[56, 100], [49, 90], [42, 80], [35, 70], [28, 60], [26, 50], [24, 40], [14, 0]] }
        };

        // --- Helper Functions ---

        const parseInputToValue = (input, isLongRun) => {
            if (!input) return 0;
            const str = String(input);
            if (isLongRun) {
                const parts = str.split('.');
                const min = parseInt(parts[0] || 0);
                const sec = parseInt(parts[1] || 0);
                return min * 60 + sec;
            } else {
                return parseFloat(str);
            }
        };

        const calculateStandardScore = (inputVal, itemName, gender) => {
            let key = itemName;
            if (itemName === '立定跳远' || itemName === '100m跑') {
                key = `${itemName}_${gender}`;
            }
            
            const standard = SCORING_STANDARDS[key];
            if (!standard) return null;

            const isLongRun = standard.type === 'long_run';
            const val = parseInputToValue(inputVal, isLongRun);
            
            const table = standard.table.map(([threshold, score]) => {
                const tVal = isLongRun ? parseInputToValue(threshold, true) : threshold;
                return [tVal, score];
            });

            if (standard.type === 'high_better') {
                if (val >= table[0][0]) return 100; 
                if (val <= table[table.length - 1][0]) return 0; 
            } else {
                if (val <= table[0][0]) return 100;
                if (val >= table[table.length - 1][0]) return 0; 
            }

            for (let i = 0; i < table.length - 1; i++) {
                const [currentVal, currentScore] = table[i];
                const [nextVal, nextScore] = table[i+1];

                let inRange = false;
                if (standard.type === 'high_better') {
                    if (val <= currentVal && val >= nextVal) inRange = true;
                } else {
                    if (val >= currentVal && val <= nextVal) inRange = true;
                }

                if (inRange) {
                    const ratio = (val - currentVal) / (nextVal - currentVal);
                    const score = currentScore + ratio * (nextScore - currentScore);
                    return parseFloat(score.toFixed(1)); 
                }
            }
            return 0;
        };

        const getDefaultSemester = () => {
            const now = new Date();
            const month = now.getMonth(); 
            const year = now.getFullYear();
            if (month >= 8 || month <= 1) {
                const academicYear = month >= 8 ? year : year - 1;
                return `${academicYear}-${academicYear + 1}-1`;
            } else {
                return `${year - 1}-${year}-2`;
            }
        };

        const getSemesterOptions = () => {
            const now = new Date();
            const currentYear = now.getFullYear();
            const options = [];
            for (let i = -2; i <= 2; i++) {
                const y = currentYear + i;
                options.push(`${y}-${y + 1}-1`);
                options.push(`${y}-${y + 1}-2`);
            }
            return options;
        };

        const getSemesterType = (semStr) => {
            const lastChar = semStr.slice(-1);
            return lastChar === '1' ? 'fall' : 'spring';
        };

        const getTestItemsName = (semesterType, gender) => {
            if (semesterType === 'fall') {
                return { item1: gender === '男' ? '1500m跑' : '1200m跑', item2: '立定跳远' };
            } else {
                return { item1: gender === '男' ? '俯卧撑' : '仰卧起坐', item2: '100m跑' };
            }
        };

        const calculateFinalScore = (scores, semesterType) => {
            const { regular1 = 0, regular2 = 0, special1 = 0, special2 = 0, runScore = 0, stdItem1 = 0, stdItem2 = 0, theory = 0 } = scores;
            const specialAvg = (parseFloat(special1) + parseFloat(special2)) / 2;
            const stdTotal = (parseFloat(stdItem1) + parseFloat(stdItem2)) / 2;
            let total = 0;
            if (semesterType === 'fall') {
                total = (regular1 * 0.1) + (regular2 * 0.1) + (stdTotal * 0.3) + (runScore * 0.1) + (specialAvg * 0.4);
            } else {
                total = (regular1 * 0.05) + (regular2 * 0.05) + (theory * 0.1) + (stdTotal * 0.3) + (runScore * 0.1) + (specialAvg * 0.4);
            }
            return total.toFixed(1);
        };

        // --- Components ---

        const Icon = ({ name, size = 20, className }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const pascalName = name.replace(/(^\w|-\w)/g, (c) => c.replace(/-/, "").toUpperCase());
                    const iconNode = window.lucide.icons[pascalName] || window.lucide.icons[name];
                    if (iconNode && iconNode.toSvg) {
                         setSvgHtml(iconNode.toSvg({ width: size, height: size, class: className }));
                    }
                }
            }, [name, size, className]);
            if (!svgHtml) return <span className={className}>{name}</span>;
            return <span style={{ display: 'contents' }} dangerouslySetInnerHTML={{ __html: svgHtml }} />;
        };

        const Toast = ({ message, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            return (
                <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl z-[9999] flex items-center animate-bounce">
                    <Icon name="check-circle" size={20} className="text-green-400 mr-2"/>
                    <span className="text-sm font-medium">{message}</span>
                </div>
            );
        };

        // 统一登录页 - 修改顺序：姓名在前，工号在后
        const LoginPage = ({ onLogin, users }) => {
            const [nameInput, setNameInput] = useState('');
            const [idInput, setIdInput] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                setError('');
                // 管理员判断逻辑：姓名输入“管理员”或“admin”，工号输入“admin888”
                if (nameInput === '管理员' || nameInput === 'admin') {
                    if (idInput === 'admin888') {
                        onLogin({ role: 'admin', name: '管理员', id: 'admin' });
                    } else {
                        setError('管理员密码错误');
                    }
                } else {
                    const teacher = users.find(u => u.name === nameInput && u.id === idInput);
                    if (teacher) {
                        onLogin({ role: 'teacher', ...teacher });
                    } else {
                        setError('教师信息未找到，请核对姓名和工号');
                    }
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-indigo-600 p-4">
                    <div className="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md">
                        <h1 className="text-2xl font-bold text-center text-gray-800 mb-2">体育成绩管理系统</h1>
                        <p className="text-center text-gray-500 text-sm mb-6">教师成绩录入端</p>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                                <input type="text" required value={nameInput} onChange={(e) => setNameInput(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-colors" placeholder="请输入姓名" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">工号 (密码)</label>
                                <input type="text" required value={idInput} onChange={(e) => setIdInput(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-colors" placeholder="请输入工号" />
                            </div>
                            {error && <p className="text-red-500 text-sm text-center animate-pulse">{error}</p>}
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors shadow-lg">登录</button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- 抽离的打分弹窗组件 ---
        const GradingModal = ({ student, semester, onClose, onSave }) => {
            const [scores, setScores] = useState({ ...student.scores });
            const [rawInputs, setRawInputs] = useState({
                item1: student.scores.rawItem1 || '',
                item2: student.scores.rawItem2 || ''
            });

            const semType = getSemesterType(semester);
            const testNames = getTestItemsName(semType, student.gender);

            const updateScore = (field, value) => {
                setScores(prev => ({ ...prev, [field]: value }));
            };

            const handleRawInput = (itemKey, value, scoreField, itemName) => {
                setRawInputs(prev => ({ ...prev, [itemKey]: value }));
                const calcScore = calculateStandardScore(value, itemName, student.gender);
                if (calcScore !== null) {
                    updateScore(scoreField, calcScore);
                }
            };

            const handleSave = () => {
                onSave(student.id, { ...scores, rawItem1: rawInputs.item1, rawItem2: rawInputs.item2 });
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-xl w-full max-w-lg shadow-2xl flex flex-col max-h-[90vh] relative z-[101]">
                        <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                            <div><h3 className="font-bold">{student.name} ({student.id})</h3><p className="text-xs text-gray-500">{student.adminClass}</p></div>
                            <button onClick={onClose} className="text-2xl">&times;</button>
                        </div>
                        <div className="p-6 overflow-y-auto hide-scrollbar space-y-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-xs text-gray-500">平时1</label><input type="number" className="w-full border p-2 rounded" value={scores.regular1} onChange={(e) => updateScore('regular1', e.target.value)} /></div>
                                <div><label className="text-xs text-gray-500">平时2</label><input type="number" className="w-full border p-2 rounded" value={scores.regular2} onChange={(e) => updateScore('regular2', e.target.value)} /></div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-xs text-gray-500">专项1</label><input type="number" className="w-full border p-2 rounded" value={scores.special1} onChange={(e) => updateScore('special1', e.target.value)} /></div>
                                <div><label className="text-xs text-gray-500">专项2</label><input type="number" className="w-full border p-2 rounded" value={scores.special2} onChange={(e) => updateScore('special2', e.target.value)} /></div>
                            </div>
                            
                            <div className="bg-blue-50 p-4 rounded-lg">
                                <h4 className="text-sm font-bold text-blue-800 mb-2">统考自动换算</h4>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs text-gray-600 block mb-1">{testNames.item1} (原始)</label>
                                            <input type="text" placeholder={testNames.item1.includes('跑') ? "如 5.40" : "个数"} className="w-full border border-blue-200 p-2 rounded focus:ring-2 ring-blue-400 outline-none" value={rawInputs.item1} onChange={(e) => handleRawInput('item1', e.target.value, 'stdItem1', testNames.item1)} />
                                        </div>
                                        <div>
                                            <label className="text-xs text-gray-600 block mb-1">折算分</label>
                                            <input type="number" className="w-full border p-2 rounded bg-gray-100 text-blue-600 font-bold" value={scores.stdItem1} readOnly />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs text-gray-600 block mb-1">{testNames.item2} (原始)</label>
                                            <input type="text" placeholder={testNames.item2.includes('跑') ? "如 8.6" : "米"} className="w-full border border-blue-200 p-2 rounded focus:ring-2 ring-blue-400 outline-none" value={rawInputs.item2} onChange={(e) => handleRawInput('item2', e.target.value, 'stdItem2', testNames.item2)} />
                                        </div>
                                        <div>
                                            <label className="text-xs text-gray-600 block mb-1">折算分</label>
                                            <input type="number" className="w-full border p-2 rounded bg-gray-100 text-blue-600 font-bold" value={scores.stdItem2} readOnly />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-xs text-gray-500">乐跑次数</label><input type="number" className="w-full border p-2 rounded bg-gray-50" value={scores.runCount} onChange={(e) => updateScore('runCount', e.target.value)} /></div>
                                <div><label className="text-xs text-gray-500">乐跑得分</label><input type="number" className="w-full border p-2 rounded" value={scores.runScore} onChange={(e) => updateScore('runScore', e.target.value)} /></div>
                            </div>
                            {semType === 'spring' && (<div><label className="text-xs text-gray-500">理论</label><input type="number" className="w-full border p-2 rounded" value={scores.theory} onChange={(e) => updateScore('theory', e.target.value)} /></div>)}
                        </div>
                        <div className="p-4 border-t flex justify-between items-center bg-gray-50 rounded-b-xl">
                            <button onClick={onClose} className="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">取消</button>
                            <button onClick={handleSave} className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 教师面板组件 ---
        const TeacherPanel = ({ currentUser, students, setStudents, semester, setSemester, onLogout }) => {
            const [editingStudent, setEditingStudent] = useState(null);
            const [toastMsg, setToastMsg] = useState('');

            const handleEdit = (student) => {
                setEditingStudent(student);
            };

            const handleSaveFullScore = (studentId, newScores) => {
                setStudents(prev => prev.map(s => {
                    if (s.id === studentId) {
                        return { ...s, scores: newScores };
                    }
                    return s;
                }));
                setToastMsg('成绩保存成功！');
            };

            const semType = getSemesterType(semester);

            return (
                <div className="min-h-screen bg-gray-100 p-4">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h1 className="text-2xl font-bold">体育成绩管理系统</h1>
                            <p className="text-sm text-gray-500">教师：{currentUser.name} | 学期：{semester}</p>
                        </div>
                        <div className="flex gap-2">
                            <select value={semester} onChange={(e) => setSemester(e.target.value)} className="px-3 py-2 border rounded-lg">
                                {getSemesterOptions().map(opt => <option key={opt} value={opt}>{opt}</option>)}
                            </select>
                            <button onClick={onLogout} className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">退出</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-bold mb-4">学生成绩列表</h2>
                        <div className="overflow-x-auto">
                            <table className="w-full border-collapse">
                                <thead>
                                    <tr className="bg-gray-50 border-b">
                                        <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">学号</th>
                                        <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">姓名</th>
                                        <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">班级</th>
                                        <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">性别</th>
                                        <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">最终成绩</th>
                                        <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {students.map(student => {
                                        const finalScore = calculateFinalScore(student.scores, semType);
                                        return (
                                            <tr key={student.id} className="border-b hover:bg-gray-50">
                                                <td className="px-4 py-3 text-sm text-gray-900">{student.id}</td>
                                                <td className="px-4 py-3 text-sm text-gray-900">{student.name}</td>
                                                <td className="px-4 py-3 text-sm text-gray-900">{student.adminClass}</td>
                                                <td className="px-4 py-3 text-sm text-gray-900">{student.gender}</td>
                                                <td className={`px-4 py-3 text-sm font-bold ${parseFloat(finalScore) >= 60 ? 'text-green-600' : 'text-red-600'}`}>{finalScore}</td>
                                                <td className="px-4 py-3">
                                                    <button onClick={() => handleEdit(student)} className="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">打分</button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {editingStudent && (
                        <GradingModal 
                            student={editingStudent} 
                            semester={semester} 
                            onClose={() => setEditingStudent(null)} 
                            onSave={handleSaveFullScore}
                        />
                    )}
                    
                    {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}
                </div>
            );
        };

        // --- 管理员面板组件 ---
        const AdminPanel = ({ students, setStudents, teachers, setTeachers, semester, setSemester, onLogout }) => {
            const [editingStudent, setEditingStudent] = useState(null);
            const [toastMsg, setToastMsg] = useState('');

            const handleEdit = (student) => {
                setEditingStudent(student);
            };

            const handleSaveFullScore = (studentId, newScores) => {
                setStudents(prev => prev.map(s => {
                    if (s.id === studentId) {
                        return { ...s, scores: newScores };
                    }
                    return s;
                }));
                setToastMsg('成绩保存成功！');
            };

            const handleAddStudent = () => {
                const newStudent = {
                    id: `S${Date.now()}`,
                    name: '新学生',
                    adminClass: '默认班级',
                    gender: '男',
                    scores: { regular1: 0, regular2: 0, special1: 0, special2: 0, runCount: 0, runScore: 0, stdItem1: 0, stdItem2: 0, theory: 0 }
                };
                setStudents(prev => [...prev, newStudent]);
                setToastMsg('学生添加成功！');
            };

            const handleDeleteStudent = (studentId) => {
                setStudents(prev => prev.filter(s => s.id !== studentId));
                setToastMsg('学生删除成功！');
            };

            const semType = getSemesterType(semester);

            return (
                <div className="min-h-screen bg-gray-100 p-4">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h1 className="text-2xl font-bold">体育成绩管理系统</h1>
                            <p className="text-sm text-gray-500">管理员面板 | 学期：{semester}</p>
                        </div>
                        <div className="flex gap-2">
                            <select value={semester} onChange={(e) => setSemester(e.target.value)} className="px-3 py-2 border rounded-lg">
                                {getSemesterOptions().map(opt => <option key={opt} value={opt}>{opt}</option>)}
                            </select>
                            <button onClick={onLogout} className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">退出</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-bold">学生管理</h2>
                                <button onClick={handleAddStudent} className="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">添加学生</button>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 border-b">
                                            <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">学号</th>
                                            <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">姓名</th>
                                            <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">班级</th>
                                            <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">性别</th>
                                            <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">最终成绩</th>
                                            <th className="px-4 py-2 text-left text-sm font-medium text-gray-700">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {students.map(student => {
                                            const finalScore = calculateFinalScore(student.scores, semType);
                                            return (
                                                <tr key={student.id} className="border-b hover:bg-gray-50">
                                                    <td className="px-4 py-3 text-sm text-gray-900">{student.id}</td>
                                                    <td className="px-4 py-3 text-sm text-gray-900">{student.name}</td>
                                                    <td className="px-4 py-3 text-sm text-gray-900">{student.adminClass}</td>
                                                    <td className="px-4 py-3 text-sm text-gray-900">{student.gender}</td>
                                                    <td className={`px-4 py-3 text-sm font-bold ${parseFloat(finalScore) >= 60 ? 'text-green-600' : 'text-red-600'}`}>{finalScore}</td>
                                                    <td className="px-4 py-3 flex gap-2">
                                                        <button onClick={() => handleEdit(student)} className="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">打分</button>
                                                        <button onClick={() => handleDeleteStudent(student.id)} className="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">删除</button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <h2 className="text-xl font-bold mb-4">教师管理</h2>
                            <div className="space-y-4">
                                {teachers.map(teacher => (
                                    <div key={teacher.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                                        <div>
                                            <p className="font-medium">{teacher.name}</p>
                                            <p className="text-xs text-gray-500">工号：{teacher.id}</p>
                                        </div>
                                        <button className="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">删除</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {editingStudent && (
                        <GradingModal 
                            student={editingStudent} 
                            semester={semester} 
                            onClose={() => setEditingStudent(null)} 
                            onSave={handleSaveFullScore}
                        />
                    )}
                    
                    {toastMsg && <Toast message={toastMsg} onClose={() => setToastMsg('')} />}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [students, setStudents] = useState(() => {
                const saved = localStorage.getItem('pe_students');
                return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
            });
            const [teachers, setTeachers] = useState(() => {
                const saved = localStorage.getItem('pe_teachers');
                return saved ? JSON.parse(saved) : INITIAL_TEACHERS;
            });
            const [semester, setSemester] = useState(() => {
                return localStorage.getItem('pe_semester') || getDefaultSemester();
            });

            useEffect(() => { localStorage.setItem('pe_students', JSON.stringify(students)); }, [students]);
            useEffect(() => { localStorage.setItem('pe_teachers', JSON.stringify(teachers)); }, [teachers]);
            useEffect(() => { localStorage.setItem('pe_semester', semester); }, [semester]);
            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, []);

            if (!user) return <LoginPage onLogin={setUser} users={teachers} />;

            return user.role === 'admin' 
                ? <AdminPanel students={students} setStudents={setStudents} teachers={teachers} setTeachers={setTeachers} semester={semester} setSemester={setSemester} onLogout={() => setUser(null)} />
                : <TeacherPanel currentUser={user} students={students} setStudents={setStudents} semester={semester} setSemester={setSemester} onLogout={() => setUser(null)} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
